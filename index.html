<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jish Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .serif { font-family: 'Instrument Serif', serif; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#faf6f3] text-zinc-800 antialiased min-h-screen">

<div id="app"></div>

<!-- Custom Toast / Alert -->
<div id="toast" class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-black/90 text-white px-6 py-3 rounded-full text-sm font-medium shadow-xl transition-all"></div>

<!-- Modal Pilih Kurir (Admin) -->
<div id="courierModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 p-4 flex items-center justify-center">
  <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-zinc-100">
    <div class="flex justify-between items-center pb-3 border-b">
      <h3 class="font-bold text-base text-zinc-900">🛵 Pilih Kurir Pengantar</h3>
      <button onclick="closeCourierModal()" class="w-8 h-8 bg-zinc-100 rounded-full flex items-center justify-center font-bold text-xs">✕</button>
    </div>
    <p class="text-xs text-zinc-500 mt-2">Pilih kurir yang bertugas mengantarkan pesanan ini ke alamat pembeli:</p>
    
    <div id="courierSelectionList" class="mt-4 space-y-2 max-h-60 overflow-y-auto pr-1"></div>

    <div class="mt-5 flex gap-2">
      <button onclick="confirmCourierAssignment()" class="flex-1 bg-purple-900 hover:bg-purple-950 text-white py-2.5 rounded-xl font-bold text-xs shadow-md transition-all">
        💾 Simpan & Ambil Kurir
      </button>
      <button onclick="closeCourierModal()" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-600 px-4 py-2.5 rounded-xl font-bold text-xs">
        Batal
      </button>
    </div>
  </div>
</div>

<!-- Modal Konfirmasi WhatsApp Status "Dalam Pengiriman" (Admin) -->
<div id="shippingWaModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] p-4 flex items-center justify-center">
  <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border border-zinc-100">
    <div class="flex justify-between items-center pb-3 border-b">
      <h3 class="font-bold text-base text-zinc-900">📲 Konfirmasi Pengiriman WhatsApp</h3>
      <button onclick="closeShippingWaModal()" class="w-8 h-8 bg-zinc-100 rounded-full flex items-center justify-center font-bold text-xs">✕</button>
    </div>
    
    <div class="mt-4 space-y-4">
      <div id="courierSelectContainer">
        <label class="text-xs font-bold text-zinc-800 block mb-1.5">1. Pilih Kurir Yang Bertugas <span id="courierReqStar" class="text-red-500">*</span></label>
        <select id="shippingCourierSelect" class="w-full text-xs p-3 rounded-2xl border border-zinc-200 bg-[#faf6f3] font-medium outline-none focus:border-purple-600">
          <option value="">-- Pilih Kurir Bertugas --</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-bold text-zinc-800 block mb-1.5">2. Pilih Tujuan Kirim Pesan WhatsApp <span class="text-red-500">*</span></label>
        <div id="shippingWaTargetList" class="space-y-2 text-xs">
          <label class="flex items-center gap-2.5 p-3 rounded-xl border border-zinc-200 bg-[#faf6f3] cursor-pointer hover:border-purple-300">
            <input type="radio" name="shippingWaTarget" value="buyer" class="accent-purple-800">
            <div>
              <span class="font-bold text-zinc-900 block">Kirim ke Pembeli saja</span>
              <span class="text-[10px] text-zinc-500">Notifikasi bahwa pesanan sedang dalam pengiriman / siap diambil</span>
            </div>
          </label>
          <label id="optCourierOnly" class="flex items-center gap-2.5 p-3 rounded-xl border border-zinc-200 bg-[#faf6f3] cursor-pointer hover:border-purple-300">
            <input type="radio" name="shippingWaTarget" value="courier" class="accent-purple-800">
            <div>
              <span class="font-bold text-zinc-900 block">Kirim ke Kurir saja</span>
              <span class="text-[10px] text-zinc-500">Instruksi pengantaran barang dan detail alamat pembeli</span>
            </div>
          </label>
          <label id="optBoth" class="flex items-center gap-2.5 p-3 rounded-xl border border-purple-200 bg-purple-50/50 cursor-pointer hover:border-purple-300">
            <input type="radio" name="shippingWaTarget" value="both" checked class="accent-purple-800">
            <div>
              <span class="font-bold text-purple-950 block">Kirim ke Keduanya (Pembeli & Kurir)</span>
              <span class="text-[10px] text-purple-700">Membuka pesan WhatsApp untuk Pembeli dan Kurir sekaligus</span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <div class="mt-6 flex gap-2">
      <button onclick="executeShippingWaConfirmation()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs shadow-md transition-all">
        💬 Konfirmasi & Kirim WA
      </button>
      <button onclick="closeShippingWaModal()" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-600 px-5 py-3 rounded-xl font-bold text-xs">
        Batal
      </button>
    </div>
  </div>
</div>

<!-- Modal Detail Produk (Pembeli) -->
<div id="productDetailModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40 p-4 flex items-end sm:items-center justify-center overflow-y-auto">
  <div class="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-3xl p-6 shadow-2xl border border-zinc-100 max-h-[90vh] overflow-y-auto relative">
    <button onclick="closeProductDetailModal()" class="absolute top-4 right-4 w-9 h-9 bg-zinc-100 hover:bg-zinc-200 rounded-full flex items-center justify-center font-bold text-sm z-10 transition-colors">✕</button>
    <div id="productDetailContent"></div>
  </div>
</div>

<!-- Modal Pengaturan Pembeli -->
<div id="settingsModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 p-4 flex items-center justify-center">
  <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-zinc-100">
    <div class="flex justify-between items-center pb-3 border-b mb-4">
      <h3 class="font-bold text-base text-zinc-900">⚙️ Pengaturan Pembeli</h3>
      <button onclick="closeSettingsModal()" class="w-8 h-8 bg-zinc-100 rounded-full flex items-center justify-center font-bold text-xs">✕</button>
    </div>
    <div class="space-y-4">
      <div class="bg-[#faf6f3] p-4 rounded-2xl border border-zinc-100 space-y-2">
        <h4 class="font-bold text-xs text-zinc-800 mb-1">👤 Profil Pembeli</h4>
        <div>
          <label class="text-[10px] font-bold text-zinc-500 block">Email Login</label>
          <input id="buyerEmailInput" type="email" placeholder="Email Login Baru" class="w-full border border-zinc-200 bg-white p-2.5 rounded-xl text-xs outline-none focus:border-purple-400">
        </div>
        <div>
          <label class="text-[10px] font-bold text-zinc-500 block">Nomor WhatsApp</label>
          <input id="buyerPhoneInput" type="tel" placeholder="Nomor WA Baru" class="w-full border border-zinc-200 bg-white p-2.5 rounded-xl text-xs outline-none focus:border-purple-400">
        </div>
      </div>

      <div class="bg-[#faf6f3] p-4 rounded-2xl border border-zinc-100 space-y-2">
        <h4 class="font-bold text-xs text-zinc-800 mb-1">🔒 Ganti Password</h4>
        <input id="currentPass" type="password" placeholder="Password Lama" class="w-full border border-zinc-200 bg-white p-2.5 rounded-xl text-xs outline-none focus:border-purple-400">
        <input id="newPass" type="password" placeholder="Password Baru" class="w-full border border-zinc-200 bg-white p-2.5 rounded-xl text-xs outline-none focus:border-purple-400">
        <input id="confirmNewPass" type="password" placeholder="Konfirmasi Password Baru" class="w-full border border-zinc-200 bg-white p-2.5 rounded-xl text-xs outline-none focus:border-purple-400">
      </div>

      <button onclick="updateBuyerSettings()" class="w-full bg-black hover:bg-zinc-800 text-white py-2.5 rounded-xl text-xs font-bold transition-all shadow-md">Simpan Perubahan</button>
      
      <button onclick="logoutUser()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 py-3 rounded-2xl font-bold text-xs transition-all flex items-center justify-center gap-2">
        <span>🚪</span> Keluar Aplikasi
      </button>
    </div>
  </div>
</div>

<script>
// --- KONFIGURASI TOKO ---
let adminAccount = {
  email: "admin@toko.com",
  pass: "admin123",
  phone: "6283132317003"
};

let WA_NUMBER = adminAccount.phone;

// --- STATE MANAGEMENT ---
let products = [];
let thirdPartyProducts = [];
let couriers = [
  { id: 1, name: "Budi Santoso", phone: "081234567890", photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" },
  { id: 2, name: "Ahmad Rizki", phone: "085678901234", photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200" }
];

let cart = [];
let buyers = [];
let orders = [];
let chatMessages = [];

let siteSettings = {
  storeName: "Jish Store",
  bannerImage: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800",
  bannerTitle1: "Koleksi Terbaru",
  bannerTitle2: "Jish Store",
  bannerDesc: "Pilihan produk harian kualitas terbaik"
};

let categorySizes = {};

let deliverySettings = {
  deliveryLabel: "🚚 Diantarkan ke Alamat",
  pickupLabel: "🏪 Ambil Sendiri di Toko",
  deliveryFee: 15000,
  minQtyForDiscount: 3,
  discountAmount: 10000,
  selectedMethod: ""
};

// Keranjang lokal & Sesi Login Pembeli/Admin tetap disimpan per-browser/per-HP
let currentBuyer = JSON.parse(sessionStorage.getItem('ssr_cb') || 'null');
let isAdmin = sessionStorage.getItem('ssr_ad') === '1';

let view = isAdmin ? 'admin' : (currentBuyer ? 'shop' : 'gate');
let adminTab = 'thirdparty';
let filterCat = 'All';

let buyerSearchQuery = '';
let searchMainProductQuery = '';
let searchTpStoreQuery = '';
let searchTpItemQueries = {};

let editId = null;
let tempImg = '';
let tempProductColors = [];

let editTpId = null;
let tempTpImg = '';
let tempTpProductColors = [];

let editCourierId = null;
let tempCourierPhoto = '';

let activeAssignOrderId = null;
let selectedCourierIdInModal = null;
let activeShippingWaOrderId = null;
let tempBannerImg = '';

// State Temp Detail Produk Pembeli Modal
let activeDetailProduct = null;
let selectedDetailColorIndex = 0;
let selectedDetailSize = '';

// State Temp untuk Accordion/Toggle Detail Pesanan di Admin
let expandedOrders = {};

// State Temp untuk Admin Chat
let selectedAdminChatEmail = null;

// --- FUNGSI SIMPAN KE FIREBASE REALTIME DATABASE & LOCALSTORAGE ---
const save = () => {
  // 1. Cadangkan ke localStorage agar data tidak hilang saat offline/refresh cepat
  try {
    localStorage.setItem('ssr_v3', JSON.stringify(products));
    localStorage.setItem('ssr_tp', JSON.stringify(thirdPartyProducts));
    localStorage.setItem('ssr_couriers', JSON.stringify(couriers));
    localStorage.setItem('ssr_b', JSON.stringify(buyers));
    localStorage.setItem('ssr_o', JSON.stringify(orders));
    localStorage.setItem('ssr_s', JSON.stringify(siteSettings));
    localStorage.setItem('ssr_cat_sizes', JSON.stringify(categorySizes));
    localStorage.setItem('ssr_del_s', JSON.stringify(deliverySettings));
    localStorage.setItem('ssr_chat', JSON.stringify(chatMessages));
  } catch (e) {
    console.warn("Gagal menyimpan ke localStorage:", e);
  }

  // 2. Simpan ke Firebase Realtime Database jika sudah siap
  if (window.dbSet && window.dbRef && window.db) {
    window.dbSet(window.dbRef(window.db, 'app_data'), {
      products: products || [],
      thirdPartyProducts: thirdPartyProducts || [],
      couriers: couriers || [],
      buyers: buyers || [],
      orders: orders || [],
      siteSettings: siteSettings || {},
      categorySizes: categorySizes || {},
      deliverySettings: deliverySettings || {},
      chatMessages: chatMessages || [],
      adminAccount: adminAccount || {}
    }).catch(err => console.error("Gagal menyimpan ke Firebase:", err));
  } else {
    // Jika Firebase belum siap saat tombol diklik, coba lagi 1 detik kemudian
    setTimeout(() => {
      if (window.dbSet && window.dbRef && window.db) {
        window.dbSet(window.dbRef(window.db, 'app_data'), {
          products: products || [],
          thirdPartyProducts: thirdPartyProducts || [],
          couriers: couriers || [],
          buyers: buyers || [],
          orders: orders || [],
          siteSettings: siteSettings || {},
          categorySizes: categorySizes || {},
          deliverySettings: deliverySettings || {},
          chatMessages: chatMessages || [],
          adminAccount: adminAccount || {}
        });
      }
    }, 1000);
  }
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

function getAllProducts() {
  return [...products, ...thirdPartyProducts];
}

function toggleOrderDetails(orderId) {
  expandedOrders[orderId] = !expandedOrders[orderId];
  render();
}

// --- RENDER ROUTER ---
function render() {
  document.title = siteSettings.storeName;
  const app = document.getElementById('app');
  if (view === 'gate') app.innerHTML = gate();
  else if (view === 'login') app.innerHTML = login();
  else if (view === 'register') app.innerHTML = register();
  else if (view === 'loginAdmin') app.innerHTML = loginAdmin();
  else if (view === 'shop') app.innerHTML = shop();
  else if (view === 'admin') app.innerHTML = isAdmin ? admin() : loginAdmin();
  else if (view === 'history') app.innerHTML = currentBuyer ? history() : gate();
  else if (view === 'chat') app.innerHTML = currentBuyer ? chatBuyer() : gate();
  else app.innerHTML = gate();
}

function gate() {
  return `
  <div class="min-h-screen grid place-items-center p-6 bg-[#faf6f3]">
    <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-sm border border-zinc-100 text-center">
      <h1 class="serif text-4xl leading-none tracking-wide mb-8">${siteSettings.storeName}</h1>
      <p class="text-sm font-semibold text-zinc-700 mb-4">Pilih Akses Masuk</p>
      
      <div class="space-y-3">
        <button onclick="view='login';render()" class="w-full bg-[#cbb6e2] hover:bg-[#b79ed1] text-white py-3.5 rounded-full font-medium text-sm shadow-md active:scale-98 transition-all">
          🛍️ Masuk Sebagai Pembeli
        </button>
        <button onclick="view='loginAdmin';render()" class="w-full bg-black hover:bg-zinc-800 text-white py-3.5 rounded-full font-medium text-sm shadow-md active:scale-98 transition-all">
          🔒 Masuk Sebagai Admin
        </button>
      </div>

      <div class="mt-6 border-t pt-4">
        <p class="text-xs text-zinc-500">Belum punya akun pembeli?</p>
        <button onclick="view='register';render()" class="text-[#a48bc1] hover:underline font-bold text-xs mt-1">Daftar Akun Baru</button>
      </div>
    </div>
  </div>`;
}

function login() {
  return `
  <div class="min-h-screen grid place-items-center p-6 bg-[#faf6f3]">
    <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-sm border border-zinc-100">
      <h2 class="serif text-3xl text-center">Masuk Akun</h2>
      <p class="text-[10px] text-zinc-400 text-center mb-6 tracking-widest uppercase">PEMBELI • ${siteSettings.storeName}</p>
      
      <input id="le" type="text" placeholder="Email atau No. WhatsApp" class="w-full border border-zinc-200 bg-[#faf6f3] p-3.5 rounded-xl mb-3 text-sm outline-none focus:border-[#cbb6e2]">
      <input id="lp" type="password" placeholder="Password" class="w-full border border-zinc-200 bg-[#faf6f3] p-3.5 rounded-xl mb-5 text-sm outline-none focus:border-[#cbb6e2]">
      
      <button onclick="doLogin()" class="w-full bg-[#cbb6e2] hover:bg-[#b79ed1] text-white py-3.5 rounded-full font-medium text-sm shadow-md active:scale-98 transition-all">
        Masuk ke Aplikasi
      </button>
      
      <p class="text-center text-xs text-zinc-500 mt-5">Belum punya akun? <button onclick="view='register';render()" class="text-[#a48bc1] font-bold hover:underline">Daftar</button></p>
      <button onclick="view='gate';render()" class="w-full mt-4 text-xs text-zinc-400 text-center block hover:text-zinc-600">← Kembali ke Pilihan Akses</button>
    </div>
  </div>`;
}

function register() {
  return `
  <div class="min-h-screen grid place-items-center p-6 bg-[#faf6f3]">
    <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-sm border border-zinc-100">
      <h2 class="serif text-3xl text-center mb-1">Buat Akun</h2>
      <p class="text-[10px] text-zinc-400 text-center mb-6 tracking-widest uppercase">Pendaftaran Pembeli • ${siteSettings.storeName}</p>
      
      <input id="rn" placeholder="Nama Lengkap" class="w-full border border-zinc-200 bg-[#faf6f3] p-3.5 rounded-xl mb-3 text-sm outline-none focus:border-[#cbb6e2]">
      <input id="re" type="email" placeholder="Email" class="w-full border border-zinc-200 bg-[#faf6f3] p-3.5 rounded-xl mb-3 text-sm outline-none focus:border-[#cbb6e2]">
      <input id="rw" type="tel" placeholder="Nomor WhatsApp Aktif (cth: 08123456789)" class="w-full border border-zinc-200 bg-[#faf6f3] p-3.5 rounded-xl mb-3 text-sm outline-none focus:border-[#cbb6e2]">
      <textarea id="ra" placeholder="Alamat Lengkap" rows="2" class="w-full border border-zinc-200 bg-[#faf6f3] p-3.5 rounded-xl mb-3 text-sm outline-none focus:border-[#cbb6e2]"></textarea>
      <input id="rp" type="password" placeholder="Password" class="w-full border border-zinc-200 bg-[#faf6f3] p-3.5 rounded-xl mb-3 text-sm outline-none focus:border-[#cbb6e2]">
      <input id="rpc" type="password" placeholder="Konfirmasi Password" class="w-full border border-zinc-200 bg-[#faf6f3] p-3.5 rounded-xl mb-5 text-sm outline-none focus:border-[#cbb6e2]">
      
      <button onclick="doReg()" class="w-full bg-[#cbb6e2] hover:bg-[#b79ed1] text-white py-3.5 rounded-full font-medium text-sm shadow-md active:scale-98 transition-all">Daftar</button>
      <button onclick="view='login';render()" class="w-full mt-4 text-xs text-zinc-500 text-center block hover:text-zinc-700">← Kembali ke Login Pembeli</button>
    </div>
  </div>`;
}

function loginAdmin() {
  return `
  <div class="min-h-screen grid place-items-center p-6 bg-[#faf6f3]">
    <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-sm border border-zinc-100">
      <h2 class="serif text-2xl text-center">Login Admin</h2>
      <p class="text-xs text-zinc-400 text-center mb-4">Akses khusus pengelola toko</p>
      
      <input id="ae" type="email" placeholder="Email Admin" class="w-full border border-zinc-200 p-3.5 rounded-xl mb-3 text-sm bg-[#faf6f3]">
      <input id="ap" type="password" placeholder="Password Admin" class="w-full border border-zinc-200 p-3.5 rounded-xl mb-4 text-sm bg-[#faf6f3]">
      
      <button onclick="doLoginAdmin()" class="w-full bg-black hover:bg-zinc-800 text-white py-3.5 rounded-full text-sm font-medium shadow-md active:scale-98 transition-all">
        Masuk Dashboard Admin
      </button>
      
      <button onclick="view='gate';render()" class="w-full mt-4 text-xs text-zinc-400 text-center block hover:text-zinc-600">← Kembali ke Pilihan Akses</button>
    </div>
  </div>`;
}

function doReg() {
  const n = document.getElementById('rn').value.trim();
  const e = document.getElementById('re').value.trim();
  const w = document.getElementById('rw').value.trim();
  const a = document.getElementById('ra').value.trim();
  const p = document.getElementById('rp').value;
  const pc = document.getElementById('rpc').value;

  if (!n || !e || !w || !a || !p || !pc) return showToast('Lengkapi semua bidang!');
  if (p !== pc) return showToast('Konfirmasi password tidak cocok!');
  if (buyers.find(b => b.email === e)) return showToast('Email sudah terdaftar!');
  
  const cleanWa = w.replace(/[^0-9]/g, '');
  if (buyers.find(b => b.phone === cleanWa || b.phone === w)) return showToast('Nomor WhatsApp sudah terdaftar!');

  buyers.push({ name: n, email: e, phone: cleanWa, address: a, pass: p, registeredAt: new Date().toISOString() });
  save();

  const waMsg = encodeURIComponent("Halo saya telah berhasil mendaftarkan akun saya di jish store!");
  window.open(`https://wa.me/${WA_NUMBER}?text=${waMsg}`, '_blank');

  showToast('Pendaftaran berhasil, silakan login!');
  view = 'login';
  render();
}

function doLogin() {
  const input = document.getElementById('le').value.trim();
  const p = document.getElementById('lp').value;
  const cleanInput = input.replace(/[^0-9]/g, '');

  const f = buyers.find(b => (b.email === input || (b.phone && b.phone === cleanInput)) && b.pass === p);
  if (!f) return showToast('Email/WA atau password salah!');
  
  currentBuyer = f;
  sessionStorage.setItem('ssr_cb', JSON.stringify(f));
  view = 'shop';
  render();
  showToast('Selamat datang, ' + f.name);
}

function doLoginAdmin() {
  const e = document.getElementById('ae').value;
  const p = document.getElementById('ap').value;
  if (e === adminAccount.email && p === adminAccount.pass) {
    sessionStorage.setItem('ssr_ad', '1');
    isAdmin = true;
    view = 'admin';
    render();
    showToast('Login Admin Berhasil');
  } else {
    showToast('Kredensial Admin Salah!');
  }
}

function saveAdminSettings() {
  const newWa = document.getElementById('adm_wa').value.trim();
  const newEmail = document.getElementById('adm_email').value.trim();
  const newPass = document.getElementById('adm_pass').value;
  const confirmPass = document.getElementById('adm_confirm_pass').value;

  if (!newWa || !newEmail || !newPass || !confirmPass) {
    return showToast('Semua bidang harus diisi!');
  }

  if (newPass !== confirmPass) {
    return showToast('Konfirmasi password tidak cocok!');
  }

  adminAccount.phone = newWa.replace(/[^0-9]/g, '');
  adminAccount.email = newEmail;
  adminAccount.pass = newPass;

  WA_NUMBER = adminAccount.phone;

  save();
  showToast('Pengaturan Admin Berhasil Diperbarui!');
  render();
}

function logoutUser() {
  sessionStorage.removeItem('ssr_cb');
  sessionStorage.removeItem('ssr_ad');
  currentBuyer = null;
  isAdmin = false;
  closeSettingsModal();
  view = 'gate';
  render();
  showToast('Berhasil keluar');
}

function openSettingsModal() {
  if (currentBuyer) {
    document.getElementById('buyerEmailInput').value = currentBuyer.email || '';
    document.getElementById('buyerPhoneInput').value = currentBuyer.phone || '';
  }
  document.getElementById('currentPass').value = '';
  document.getElementById('newPass').value = '';
  document.getElementById('confirmNewPass').value = '';
  document.getElementById('settingsModal').classList.remove('hidden');
}

function closeSettingsModal() {
  document.getElementById('settingsModal').classList.add('hidden');
}

function updateBuyerSettings() {
  if (!currentBuyer) return;
  const newEmail = document.getElementById('buyerEmailInput').value.trim();
  const newPhone = document.getElementById('buyerPhoneInput').value.trim();
  const oldP = document.getElementById('currentPass').value;
  const newP = document.getElementById('newPass').value;
  const confirmP = document.getElementById('confirmNewPass').value;

  if (!newEmail || !newPhone) return showToast('Email dan Nomor WhatsApp harus diisi!');

  const cleanPhone = newPhone.replace(/[^0-9]/g, '');
  const existingEmail = buyers.find(b => b.email === newEmail && b.email !== currentBuyer.email);
  if (existingEmail) return showToast('Email sudah digunakan oleh akun lain!');

  const existingPhone = buyers.find(b => b.phone === cleanPhone && b.email !== currentBuyer.email);
  if (existingPhone) return showToast('Nomor WhatsApp sudah digunakan oleh akun lain!');

  let passUpdated = false;
  if (oldP || newP || confirmP) {
    if (!oldP) return showToast('Masukkan password lama Anda!');
    if (currentBuyer.pass !== oldP) return showToast('Password lama Anda salah!');
    if (!newP) return showToast('Masukkan password baru!');
    if (newP !== confirmP) return showToast('Konfirmasi password baru tidak cocok!');
    passUpdated = true;
  }

  const idx = buyers.findIndex(b => b.email === currentBuyer.email);
  
  if (chatMessages && chatMessages.length > 0) {
    chatMessages.forEach(c => {
      if (c.buyerEmail === currentBuyer.email) c.buyerEmail = newEmail;
    });
  }
  if (orders && orders.length > 0) {
    orders.forEach(o => {
      if (o.buyerEmail === currentBuyer.email) {
        o.buyerEmail = newEmail;
        o.buyerPhone = cleanPhone;
      }
    });
  }

  currentBuyer.email = newEmail;
  currentBuyer.phone = cleanPhone;
  if (passUpdated) currentBuyer.pass = newP;

  if (idx > -1) {
    buyers[idx].email = newEmail;
    buyers[idx].phone = cleanPhone;
    if (passUpdated) buyers[idx].pass = newP;
  }

  sessionStorage.setItem('ssr_cb', JSON.stringify(currentBuyer));
  save();
  closeSettingsModal();
  render();
  showToast('Pengaturan akun berhasil diperbarui!');
}

function changePassword() {
  updateBuyerSettings();
}

    return matchCat && matchSearch;

  const shippingDiscount = isDiscountEligible ? Math.min(rawShippingFee, (deliverySettings.discountAmount || 0)) : 0;
  const finalShippingFee = Math.max(0, rawShippingFee - shippingDiscount);

// LOGIKA HANDLING DETAIL PRODUK & VARIATION PEMBELI
function handleProductClick(id) {
  const p = getAllProducts().find(x => x.id === id);
  if (!p) return;

  if (p.hasVariations && p.colors && p.colors.length > 0) {
    activeDetailProduct = p;
    selectedDetailColorIndex = 0;
    selectedDetailSize = '';
    openProductDetailModal();
  } else {
    addDirectToCart(p.id);
  }
}

function openProductDetailModal() {
  renderProductDetailContent();
  document.getElementById('productDetailModal').classList.remove('hidden');
}

function closeProductDetailModal() {
  document.getElementById('productDetailModal').classList.add('hidden');
  activeDetailProduct = null;
}

function renderProductDetailContent() {
  if (!activeDetailProduct) return;
  const p = activeDetailProduct;
  const currentColor = p.colors[selectedDetailColorIndex];
  const displayImage = currentColor ? currentColor.image : p.image;

  let currentStock = p.stock;
  if (currentColor && selectedDetailSize) {
    const szObj = currentColor.sizes.find(s => s.size === selectedDetailSize);
    currentStock = szObj ? Number(szObj.stock) || 0 : 0;
  } else if (currentColor) {
    currentStock = currentColor.sizes.reduce((sum, s) => sum + (Number(s.stock)||0), 0);
  }

  const container = document.getElementById('productDetailContent');
  container.innerHTML = `
    <div class="text-center">
      <img id="detailMainImg" src="${displayImage}" class="w-full h-64 object-cover rounded-2xl shadow-sm border border-zinc-200 mb-4">
      <h3 class="serif text-2xl font-bold text-zinc-900 leading-tight">${p.name}</h3>
      <p class="text-xs text-zinc-500 font-semibold mt-1">${p.cat} • <span class="text-[#8857b5] font-bold text-sm">Rp ${p.price.toLocaleString('id-ID')}</span></p>
    </div>

    <div class="mt-5">
      <label class="text-xs font-bold text-zinc-800 block mb-2">1. Pilih Warna Produk:</label>
      <div class="grid grid-cols-2 gap-2">
        ${p.colors.map((c, idx) => `
          <button onclick="selectDetailColor(${idx})" class="p-2.5 rounded-2xl border text-left flex items-center gap-2.5 transition-all ${selectedDetailColorIndex === idx ? 'border-purple-600 bg-purple-50 ring-2 ring-purple-300' : 'border-zinc-200 bg-white hover:border-zinc-300'}">
            <img src="${c.image}" class="w-10 h-10 rounded-xl object-cover border border-zinc-200">
            <div>
              <p class="text-xs font-bold text-zinc-900 leading-tight">${c.name}</p>
              <p class="text-[10px] text-zinc-500">${c.sizes.reduce((s, sz)=>s+(Number(sz.stock)||0),0)} stok</p>
            </div>
          </button>
        `).join('')}
      </div>
    </div>

    ${currentColor ? `
      <div class="mt-5">
        <label class="text-xs font-bold text-zinc-800 block mb-2">2. Pilih Ukuran ${currentColor.name}:</label>
        <div class="flex flex-wrap gap-2">
          ${currentColor.sizes.map(sz => {
            const isOutOfStock = (Number(sz.stock)||0) <= 0;
            return `
            <button ${isOutOfStock ? 'disabled' : ''} onclick="selectDetailSize('${sz.size}')" class="px-4 py-2 rounded-xl text-xs font-bold border transition-all ${selectedDetailSize === sz.size ? 'bg-black text-white border-black shadow-md' : (isOutOfStock ? 'bg-zinc-100 text-zinc-400 border-zinc-200 cursor-not-allowed line-through' : 'bg-white text-zinc-700 border-zinc-200 hover:border-zinc-400')}">
              Ukuran ${sz.size} ${isOutOfStock ? '(Habis)' : `(${sz.stock})`}
            </button>
          `}).join('')}
        </div>
      </div>
    ` : ''}

    <div class="mt-6 pt-4 border-t border-zinc-100 flex items-center justify-between gap-3">
      <div>
        <span class="text-[10px] text-zinc-400 block font-semibold">Sisa Stok Pilihan:</span>
        <span class="text-xs font-bold ${currentStock > 0 ? 'text-emerald-600' : 'text-red-500'}">${currentStock > 0 ? currentStock + ' Pcs' : 'Stok Kosong'}</span>
      </div>

      <button onclick="confirmAddToCartFromDetail()" class="flex-1 bg-[#cbb6e2] hover:bg-[#b79ed1] text-white py-3.5 rounded-full font-bold text-xs shadow-md active:scale-95 transition-all">
        🛒 Tambahkan ke Keranjang
      </button>
    </div>
  `;
}

function selectDetailColor(index) {
  selectedDetailColorIndex = index;
  selectedDetailSize = '';
  renderProductDetailContent();
}

function selectDetailSize(size) {
  selectedDetailSize = size;
  renderProductDetailContent();
}

function confirmAddToCartFromDetail() {
  if (!activeDetailProduct) return;
  const p = activeDetailProduct;
  const currentColor = p.colors[selectedDetailColorIndex];

  if (!currentColor) return showToast('Pilih warna produk terlebih dahulu!');
  if (!selectedDetailSize) return showToast('Wajib memilih ukuran produk terlebih dahulu!');

  const szObj = currentColor.sizes.find(s => s.size === selectedDetailSize);
  const sizeStock = szObj ? Number(szObj.stock) || 0 : 0;

  if (sizeStock <= 0) return showToast('Stok untuk ukuran ini sedang habis!');

  const existingIndex = cart.findIndex(c => c.id === p.id && c.selectedColor === currentColor.name && c.selectedSize === selectedDetailSize);

  if (existingIndex > -1) {
    if (cart[existingIndex].qty + 1 > sizeStock) return showToast('Stok tidak mencukupi! Maksimal: ' + sizeStock);
    cart[existingIndex].qty++;
  } else {
    cart.push({
      id: p.id,
      qty: 1,
      selectedColor: currentColor.name,
      selectedColorImg: currentColor.image,
      selectedSize: selectedDetailSize
    });
  }

  save();
  closeProductDetailModal();
  render();
  showToast('Barang berhasil disimpan ke keranjang!');
}

function addDirectToCart(id) {
  const p = getAllProducts().find(x => x.id === id);
  if (!p) return;

  const existingIndex = cart.findIndex(c => c.id === id && !c.selectedColor && !c.selectedSize);
  const currentCartQty = existingIndex > -1 ? cart[existingIndex].qty : 0;

  if (currentCartQty + 1 > p.stock) return showToast('Stok tidak mencukupi! Sisa: ' + p.stock);

  if (existingIndex > -1) {
    cart[existingIndex].qty++;
  } else {
    cart.push({ id: id, qty: 1, selectedColor: '', selectedColorImg: '', selectedSize: '' });
  }

  save();
  render();
  showToast('Ditambahkan ke keranjang');
}

function focusBuyerSearch() {
  const el = document.getElementById('buyerSearchInput');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function setDeliveryMethod(val) {
  deliverySettings.selectedMethod = val;
  save();
  render();
  document.getElementById('cart').classList.remove('hidden');
}

function updateCartSize(index, size) {
  if (cart[index]) {
    cart[index].selectedSize = size;
    save();
  }
}

function qty(index, delta) {
  if (!cart[index]) return;
  const item = cart[index];
  const p = getAllProducts().find(x => x.id === item.id);
  
  let availableStock = p ? p.stock : 0;
  if (p && p.hasVariations && item.selectedColor && item.selectedSize) {
    const cObj = p.colors.find(c => c.name === item.selectedColor);
    if (cObj) {
      const sObj = cObj.sizes.find(s => s.size === item.selectedSize);
      if (sObj) availableStock = Number(sObj.stock) || 0;
    }
  }

  if (delta > 0 && item.qty + 1 > availableStock) return showToast('Stok maksimum tercapai');
  
  item.qty += delta;
  if (item.qty <= 0) cart.splice(index, 1);

  save();
  render();
  document.getElementById('cart').classList.remove('hidden');
}

function openCart() {
  render();
  setTimeout(() => document.getElementById('cart').classList.remove('hidden'), 50);
}

function checkout() {
  if (!currentBuyer) return showToast('Silakan login terlebih dahulu');
  if (cart.length === 0) return showToast('Keranjang Anda kosong!');

  if (!deliverySettings.selectedMethod) {
    return showToast('Mohon pilih opsi Barang Diantarkan atau Diambil di Toko!');
  }

  let subtotal = 0;
  let totalItemQty = 0;
  let txt = [];
  let orderItemsDetails = []; 
  
  for (let c of cart) {
    const p = products.find(x => x.id === c.id) || thirdPartyProducts.find(x => x.id === c.id);
    if (p) {
      if (p.hasVariations && c.selectedColor && c.selectedSize) {
        const cObj = p.colors ? p.colors.find(col => col.name === c.selectedColor) : null;
        if (cObj) {
          const sObj = cObj.sizes ? cObj.sizes.find(sz => sz.size === c.selectedSize) : null;
          if (sObj) {
            const currentStock = Number(sObj.stock) || 0;
            if (currentStock < c.qty) return showToast(`Stok ${p.name} (${c.selectedColor} - ${c.selectedSize}) kurang! Sisa: ${currentStock}`);
            sObj.stock = currentStock - c.qty;
          }
        }
      } else {
        if (p.stock < c.qty) return showToast(`Stok ${p.name} tidak mencukupi! Sisa: ${p.stock}`);
        p.stock -= c.qty;
      }

      subtotal += p.price * c.qty;
      totalItemQty += c.qty;
      
      const varText = [];
      if (c.selectedColor) varText.push(`Warna: ${c.selectedColor}`);
      if (c.selectedSize) varText.push(`Ukuran: ${c.selectedSize}`);
      const formatVar = varText.length > 0 ? ` [${varText.join(', ')}]` : '';

      txt.push(`${p.name}${formatVar} (${c.qty}x)`);

      orderItemsDetails.push({
        id: p.id,
        name: p.name,
        qty: c.qty,
        price: p.price,
        costPrice: p.costPrice || p.price,
        color: c.selectedColor || '',
        size: c.selectedSize || '',
        isThirdParty: !!p.isThirdParty,
        storeName: p.storeName || '',
        storeAddress: p.storeAddress || '',
        storePhone: p.storePhone || ''
      });
    }
  }

  const isDelivery = deliverySettings.selectedMethod === deliverySettings.deliveryLabel;
  const rawShippingFee = isDelivery ? (deliverySettings.deliveryFee || 0) : 0;
  
  const isDiscountEligible = isDelivery && (totalItemQty >= (deliverySettings.minQtyForDiscount || 1));
  const shippingDiscount = isDiscountEligible ? Math.min(rawShippingFee, (deliverySettings.discountAmount || 0)) : 0;
  const finalShippingFee = Math.max(0, rawShippingFee - shippingDiscount);
  const grandTotal = subtotal + finalShippingFee;

  const orderData = {
    id: Date.now(),
    text: txt.join(', '),
    items: orderItemsDetails, 
    deliveryMethod: deliverySettings.selectedMethod,
    subtotal: subtotal,
    rawShippingFee: rawShippingFee,
    shippingDiscount: shippingDiscount,
    shippingFee: finalShippingFee,
    total: grandTotal,
    buyerEmail: currentBuyer.email,
    buyerName: currentBuyer.name,
    buyerPhone: currentBuyer.phone || '-',
    buyerAddress: currentBuyer.address || '-',
    date: new Date().toLocaleString('id-ID'),
    status: 'Diproses',
    courier: null
  };

  orders.unshift(orderData);
  cart = [];
  const selectedDelivery = deliverySettings.selectedMethod;
  deliverySettings.selectedMethod = "";
  
  save(); 

  const waText = `Halo Admin ${siteSettings.storeName},\n\nSaya *${currentBuyer.name}*\n📱 No. WA: ${currentBuyer.phone || '-'}\n📍 Alamat Lengkap: ${currentBuyer.address || '-'}\n\nIngin memesan:\n-------------------------------------\n- ${txt.join('\n- ')}\n-------------------------------------\n📌 *Opsi Penyerahan:* ${selectedDelivery}\n💵 *Subtotal Barang:* Rp ${subtotal.toLocaleString('id-ID')}\n🚚 *Biaya Pengiriman Normal:* Rp ${rawShippingFee.toLocaleString('id-ID')}\n🎁 *Potongan Ongkir:* ${shippingDiscount > 0 ? '-Rp ' + shippingDiscount.toLocaleString('id-ID') : 'Rp 0'}\n💰 *TOTAL PEMBAYARAN:* Rp ${grandTotal.toLocaleString('id-ID')}\n-------------------------------------\nMohon diproses, terima kasih!`;
  
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}`, '_blank');
  
  view = 'history';
  render();
  showToast('Pesanan berhasil dibuat & stok barang otomatis berkurang!');
}

function openCourierModal(orderId) {
  activeAssignOrderId = orderId;
  const o = orders.find(x => x.id === orderId);
  selectedCourierIdInModal = o && o.courier ? o.courier.id : null;

  const listContainer = document.getElementById('courierSelectionList');
  if (couriers.length === 0) {
    listContainer.innerHTML = '<p class="text-xs text-zinc-400 py-4 text-center">Belum ada kurir. Tambahkan kurir di tab Pengiriman & Kurir.</p>';
  } else {
    listContainer.innerHTML = couriers.map(cr => {
      const isChecked = selectedCourierIdInModal === cr.id;
      return `
      <label class="flex items-center justify-between p-3 rounded-2xl border ${isChecked ? 'border-purple-600 bg-purple-50' : 'border-zinc-200 bg-[#faf6f3]'} cursor-pointer hover:border-purple-300 transition-all">
        <div class="flex items-center gap-3">
          <input type="radio" name="modalCourierSelect" value="${cr.id}" ${isChecked ? 'checked' : ''} onchange="selectedCourierIdInModal=${cr.id}" class="accent-purple-800">
          <img src="${cr.photo}" class="w-9 h-9 rounded-full object-cover border border-zinc-300">
          <div>
            <p class="text-xs font-bold text-zinc-900">${cr.name}</p>
            <p class="text-[10px] text-zinc-500">📱 ${cr.phone}</p>
          </div>
        </div>
      </label>`;
    }).join('');
  }

  document.getElementById('courierModal').classList.remove('hidden');
}

function closeCourierModal() {
  document.getElementById('courierModal').classList.add('hidden');
  activeAssignOrderId = null;
  selectedCourierIdInModal = null;
}

function confirmCourierAssignment() {
  if (!activeAssignOrderId) return;
  if (!selectedCourierIdInModal) return showToast('Pilih salah satu kurir!');

  const cr = couriers.find(c => c.id === selectedCourierIdInModal);
  const o = orders.find(x => x.id === activeAssignOrderId);

  if (cr && o) {
    o.courier = cr;
    save();
    closeCourierModal();
    render();
    showToast('Kurir berhasil diset untuk pesanan ini!');
  }
}

// --- FUNGSI MODAL WA SHIPPING ADMIN ---
function openShippingWaModal(orderId) {
  activeShippingWaOrderId = orderId;
  const o = orders.find(x => x.id === orderId);
  const isPickup = o && o.deliveryMethod === deliverySettings.pickupLabel;

  const courierContainer = document.getElementById('courierSelectContainer');
  const optCourierOnly = document.getElementById('optCourierOnly');
  const optBoth = document.getElementById('optBoth');
  const courierSelect = document.getElementById('shippingCourierSelect');

  courierSelect.innerHTML = '<option value="">-- Pilih Kurir Bertugas --</option>' + 
    couriers.map(cr => `<option value="${cr.id}" ${o && o.courier && o.courier.id === cr.id ? 'selected' : ''}>🛵 ${cr.name} (${cr.phone})</option>`).join('');

  if (isPickup) {
    courierContainer.classList.add('hidden');
    optCourierOnly.classList.add('hidden');
    optBoth.classList.add('hidden');
    
    const buyerRadio = document.querySelector('input[name="shippingWaTarget"][value="buyer"]');
    if (buyerRadio) buyerRadio.checked = true;
  } else {
    courierContainer.classList.remove('hidden');
    optCourierOnly.classList.remove('hidden');
    optBoth.classList.remove('hidden');

    const bothRadio = document.querySelector('input[name="shippingWaTarget"][value="both"]');
    if (bothRadio) bothRadio.checked = true;
  }

  document.getElementById('shippingWaModal').classList.remove('hidden');
}

function closeShippingWaModal() {
  document.getElementById('shippingWaModal').classList.add('hidden');
  activeShippingWaOrderId = null;
}

function executeShippingWaConfirmation() {
  if (!activeShippingWaOrderId) return;
  const o = orders.find(x => x.id === activeShippingWaOrderId);
  if (!o) return;

  const isPickup = o.deliveryMethod === deliverySettings.pickupLabel;
  const courierSelectVal = document.getElementById('shippingCourierSelect').value;
  const targetRadio = document.querySelector('input[name="shippingWaTarget"]:checked');
  const target = targetRadio ? targetRadio.value : 'buyer';

  if (!isPickup && (target === 'courier' || target === 'both' || courierSelectVal)) {
    if (!courierSelectVal && (target === 'courier' || target === 'both')) {
      return showToast('Pilih kurir bertugas terlebih dahulu!');
    }
    if (courierSelectVal) {
      const cr = couriers.find(c => c.id === Number(courierSelectVal));
      if (cr) o.courier = cr;
    }
  }

  o.status = 'Dalam Pengiriman';
  save();

  const cleanBuyerPhone = o.buyerPhone ? o.buyerPhone.replace(/[^0-9]/g, '') : '';
  const cleanCourierPhone = o.courier ? o.courier.phone.replace(/[^0-9]/g, '') : '';

  let buyerText = "";
  if (isPickup) {
    buyerText = `Halo kak *${o.buyerName}*,\n\nPesanan Anda di *${siteSettings.storeName}* dengan ID Pesanan *#${o.id}* sudah siap untuk diambil di toko!\n\n📋 *Ringkasan Barang:* ${o.text}\n💰 *Total Pembayaran:* Rp ${o.total.toLocaleString('id-ID')}\n\nSilakan datang ke toko kami. Terima kasih!`;
  } else {
    buyerText = `Halo kak *${o.buyerName}*,\n\nPesanan Anda di *${siteSettings.storeName}* dengan ID Pesanan *#${o.id}* saat ini *SEDANG DALAM PENGIRIMAN* oleh kurir kami!\n\n📋 *Ringkasan Barang:* ${o.text}\n💰 *Total Pembayaran:* Rp ${o.total.toLocaleString('id-ID')}\n🛵 *Kurir Pengantar:* ${o.courier ? o.courier.name : '-'}\n📱 *No. Kurir:* ${o.courier ? o.courier.phone : '-'}\n\nMohon bersiap menerima pesanan di alamat tujuan. Terima kasih!`;
  }

  let courierText = `Halo *${o.courier ? o.courier.name : 'Kurir'}*,\n\nAda tugas pengantaran pesanan baru dari *${siteSettings.storeName}*:\n-------------------------------------\n📦 *ID Pesanan:* #${o.id}\n👤 *Nama Pembeli:* ${o.buyerName}\n📱 *No. WA Pembeli:* ${o.buyerPhone}\n📍 *Alamat Tujuan:* ${o.buyerAddress}\n-------------------------------------\n📋 *Barang:* ${o.text}\n💰 *Total Tagihan:* Rp ${o.total.toLocaleString('id-ID')}\n-------------------------------------\nMohon segera diantarkan ke alamat tujuan. Terima kasih!`;

  if (target === 'buyer') {
    if (cleanBuyerPhone) window.open(`https://wa.me/${cleanBuyerPhone}?text=${encodeURIComponent(buyerText)}`, '_blank');
  } else if (target === 'courier') {
    if (cleanCourierPhone) window.open(`https://wa.me/${cleanCourierPhone}?text=${encodeURIComponent(courierText)}`, '_blank');
  } else if (target === 'both') {
    if (cleanBuyerPhone) window.open(`https://wa.me/${cleanBuyerPhone}?text=${encodeURIComponent(buyerText)}`, '_blank');
    setTimeout(() => {
      if (cleanCourierPhone) window.open(`https://wa.me/${cleanCourierPhone}?text=${encodeURIComponent(courierText)}`, '_blank');
    }, 1000);
  }

  closeShippingWaModal();
  render();
  showToast('Status diperbarui menjadi Dalam Pengiriman & Pesan WA dikirim!');
}

function updateOrderStatus(orderId, newStatus) {
  const o = orders.find(x => x.id === orderId);

// --- FUNGSI FORM PRODUK TOKO LAIN (THIRD-PARTY) ---
function saveTpProduct() {
  const storeName = document.getElementById('tp_storeName').value.trim();
  const storePhone = document.getElementById('tp_storePhone').value.trim();
  const storeAddress = document.getElementById('tp_storeAddress').value.trim();
  const name = document.getElementById('tp_name').value.trim();
  const costPrice = Number(document.getElementById('tp_costPrice').value);
  const price = Number(document.getElementById('tp_price').value);
  const stock = Number(document.getElementById('tp_stock').value) || 0;
  const cat = document.getElementById('tp_cat').value.trim() || 'General';
  const hasVariations = document.getElementById('tpHasVariations').checked;

  if (!storeName || !storePhone || !storeAddress || !name || !costPrice || !price) {
    return showToast('Lengkapi nama toko, kontak, alamat, nama barang, harga beli, dan harga jual!');
  }

  const cleanStorePhone = storePhone.replace(/[^0-9]/g, '');

  let colorsList = [];
  if (hasVariations) {
    colorsList = collectColorsData('tp');
    if (colorsList.length === 0) return showToast('Tambahkan minimal 1 warna variasi!');
  }

  if (editTpId) {
    const idx = thirdPartyProducts.findIndex(p => p.id === editTpId);
    if (idx > -1) {
      thirdPartyProducts[idx] = {
        ...thirdPartyProducts[idx],
        storeName,
        storePhone: cleanStorePhone,
        storeAddress,
        name,
        costPrice,
        price,
        stock,
        cat,
        image: tempTpImg || thirdPartyProducts[idx].image,
        hasVariations,
        colors: colorsList
      };
    }
  } else {
    thirdPartyProducts.unshift({
      id: Date.now(),
      isThirdParty: true,
      storeName,
      storePhone: cleanStorePhone,
      storeAddress,
      name,
      costPrice,
      price,
      stock,
      cat,
      image: tempTpImg || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
      hasVariations,
      colors: colorsList
    });
  }

  save();
  resetTpForm();
  render();
  showToast('Barang toko lain berhasil disimpan!');
}

function editTpProduct(id) {
  const p = thirdPartyProducts.find(x => x.id === id);
  if (!p) return;

  editTpId = p.id;
  tempTpImg = p.image;
  tempTpProductColors = JSON.parse(JSON.stringify(p.colors || []));

  render();

  setTimeout(() => {
    document.getElementById('tp_storeName').value = p.storeName || '';
    document.getElementById('tp_storePhone').value = p.storePhone || '';
    document.getElementById('tp_storeAddress').value = p.storeAddress || '';
    document.getElementById('tp_name').value = p.name;
    document.getElementById('tp_costPrice').value = p.costPrice || p.price;
    document.getElementById('tp_price').value = p.price;
    document.getElementById('tp_stock').value = p.stock;
    document.getElementById('tp_cat').value = p.cat;

    const pr = document.getElementById('tp_preview');
    if (pr) { pr.src = p.image; pr.classList.remove('hidden'); }

    const chk = document.getElementById('tpHasVariations');
    if (chk) {
      chk.checked = !!p.hasVariations;
      toggleVariationSection(chk.checked, 'tp');
      if (p.hasVariations) {
        renderColorList('tp', tempTpProductColors);
      }
    }

    const container = document.getElementById('tpFormContainer');
    if (container) container.scrollIntoView({ behavior: 'smooth' });
  }, 100);
}

function deleteTpProduct(id) {
  if (confirm('Yakin ingin menghapus barang toko lain ini?')) {
    thirdPartyProducts = thirdPartyProducts.filter(x => x.id !== id);
    save();
    render();
    showToast('Barang berhasil dihapus!');
  }
}

function resetTpForm() {
  editTpId = null;
  tempTpImg = '';
  tempTpProductColors = [];
  render();
}

function addTpProductToStore(storeName, storePhone, storeAddress) {
  resetTpForm();
  setTimeout(() => {
    document.getElementById('tp_storeName').value = storeName;
    document.getElementById('tp_storePhone').value = storePhone;
    document.getElementById('tp_storeAddress').value = storeAddress;

    const container = document.getElementById('tpFormContainer');
    if (container) container.scrollIntoView({ behavior: 'smooth' });

}

function focusTpSearch() {
  const el = document.getElementById('tpSearchInput');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function updateTpItemSearch(storeName, val) {
  searchTpItemQueries[storeName] = val;
  render();
  setTimeout(() => {
    const el = document.getElementById(`tpItemSearch_${encodeURIComponent(storeName)}`);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }

function compressAndPreviewTpImage(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      tempTpImg = e.target.result;
      const pr = document.getElementById('tp_preview');
      if (pr) { pr.src = tempTpImg; pr.classList.remove('hidden'); }
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// --- FUNGSI HELPER VARIASI DUAL MODE ('main' / 'tp') ---
function toggleVariationSection(checked, type) {
  const container = document.getElementById(type === 'main' ? 'mainVariationContainer' : 'tpVariationContainer');
  const stockInput = document.getElementById(type === 'main' ? 'ps' : 'tp_stock');

  if (checked) {
    if (container) container.classList.remove('hidden');
    if (stockInput) { stockInput.disabled = true; stockInput.value = '0'; }
    const list = type === 'main' ? tempProductColors : tempTpProductColors;
    if (list.length === 0) {
      addColorVariation(type);
    } else {
      renderColorList(type, list);
    }
  } else {
    if (container) container.classList.add('hidden');
    if (stockInput) stockInput.disabled = false;
  }
}

function addColorVariation(type) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  targetArray.push({
    name: '',
    image: '',
    sizes: [
      { size: 'S', stock: 5 },
      { size: 'M', stock: 5 }
    ]
  });
  renderColorList(type, targetArray);
}

function removeColorVariation(type, index) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  targetArray.splice(index, 1);
  renderColorList(type, targetArray);
}

function addSizeToColor(type, colorIndex) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  if (targetArray[colorIndex]) {
    targetArray[colorIndex].sizes.push({ size: 'L', stock: 5 });
    renderColorList(type, targetArray);
  }
}

function removeSizeFromColor(type, colorIndex, sizeIndex) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  if (targetArray[colorIndex] && targetArray[colorIndex].sizes) {
    targetArray[colorIndex].sizes.splice(sizeIndex, 1);
    renderColorList(type, targetArray);
  }
}

function renderColorList(type, colorsArray) {
  const listContainer = document.getElementById(type === 'main' ? 'mainColorList' : 'tpColorList');
  if (!listContainer) return;

  listContainer.innerHTML = colorsArray.map((c, cIdx) => `
    <div class="p-3 bg-white rounded-2xl border border-purple-200 space-y-2">
      <div class="flex justify-between items-center gap-2">
        <input type="text" value="${c.name}" placeholder="Nama Warna (cth: Merah)" onchange="${type === 'main' ? 'tempProductColors' : 'tempTpProductColors'}[${cIdx}].name=this.value" class="flex-1 border border-zinc-200 bg-[#faf6f3] p-2 rounded-xl text-xs font-bold outline-none">
        <button onclick="removeColorVariation('${type}', ${cIdx})" class="text-red-500 hover:text-red-700 font-bold text-xs p-1">🗑️</button>
      </div>

      <div class="flex items-center gap-2">
        <input type="file" accept="image/*" onchange="compressColorImg(this, '${type}', ${cIdx})" class="w-full text-[11px] text-zinc-500 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:bg-purple-100 file:text-purple-900">
        <img id="${type}_color_preview_${cIdx}" src="${c.image || 'https://via.placeholder.com/100'}" class="w-8 h-8 rounded-lg object-cover border border-zinc-200">
      </div>

      <div class="pt-2 border-t border-zinc-100">
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-[11px] font-bold text-zinc-700">Ukuran & Stok Warna Ini:</span>
          <button onclick="addSizeToColor('${type}', ${cIdx})" class="text-purple-800 hover:underline font-bold text-[11px]">+ Tambah Ukuran</button>
        </div>
        
        <div class="space-y-1.5">
          ${c.sizes.map((sz, sIdx) => `
            <div class="flex items-center gap-2">
              <input type="text" value="${sz.size}" placeholder="Ukuran (cth: 39 / XL)" onchange="${type === 'main' ? 'tempProductColors' : 'tempTpProductColors'}[${cIdx}].sizes[${sIdx}].size=this.value" class="w-24 border border-zinc-200 p-1.5 rounded-lg text-xs font-semibold">
              <input type="number" value="${sz.stock}" placeholder="Stok" onchange="${type === 'main' ? 'tempProductColors' : 'tempTpProductColors'}[${cIdx}].sizes[${sIdx}].stock=Number(this.value)" class="w-20 border border-zinc-200 p-1.5 rounded-lg text-xs font-bold text-emerald-800">
              <button onclick="removeSizeFromColor('${type}', ${cIdx},${sIdx})" class="text-red-400 hover:text-red-600 font-bold text-xs">✕</button>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function compressColorImg(input, type, colorIndex) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
      if (targetArray[colorIndex]) {
        targetArray[colorIndex].image = e.target.result;
        const imgEl = document.getElementById(`${type}_color_preview_${colorIndex}`);
        if (imgEl) imgEl.src = e.target.result;
      }
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function collectColorsData(type) {
  const listContainer = document.getElementById(type === 'main' ? 'mainColorList' : 'tpColorList');
  if (!listContainer) return [];

  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  return targetArray.map(c => ({
    name: c.name || 'Warna Standard',
    image: c.image || 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500',
    sizes: c.sizes ? c.sizes.map(s => ({ size: String(s.size).trim(), stock: Number(s.stock) || 0 })) : []
  }));
}

// --- FUNGSI PENGATURAN ONGKIR & KURIR ---
function saveDeliverySettings() {
  const dLabel = document.getElementById('del_label').value.trim();
  const pLabel = document.getElementById('pickup_label').value.trim();
  const dFee = Number(document.getElementById('del_fee').value) || 0;
  const minQty = Number(document.getElementById('del_min_qty').value) || 1;
  const discAmt = Number(document.getElementById('del_disc_amt').value) || 0;

  deliverySettings.deliveryLabel = dLabel || "🚚 Diantarkan ke Alamat";
  deliverySettings.pickupLabel = pLabel || "🏪 Ambil Sendiri di Toko";
  deliverySettings.deliveryFee = dFee;
  deliverySettings.minQtyForDiscount = minQty;
  deliverySettings.discountAmount = discAmt;

  save();
  render();
  showToast('Pengaturan pengiriman berhasil disimpan!');
}

function saveCourier() {
  const name = document.getElementById('c_name').value.trim();
  const phone = document.getElementById('c_phone').value.trim();

  if (!name || !phone) return showToast('Isi nama dan nomor WhatsApp kurir!');

  const cleanPhone = phone.replace(/[^0-9]/g, '');

  if (editCourierId) {
    const idx = couriers.findIndex(c => c.id === editCourierId);
    if (idx > -1) {
      couriers[idx] = {
        id: editCourierId,
        name,
        phone: cleanPhone,
        photo: tempCourierPhoto || couriers[idx].photo
      };
    }
  } else {
    couriers.push({
      id: Date.now(),
      name,
      phone: cleanPhone,
      photo: tempCourierPhoto || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200"
    });
  }

  save();
  resetCourierForm();
  render();
  showToast('Data kurir berhasil disimpan!');
}

function editCourier(id) {
  const cr = couriers.find(c => c.id === id);
  if (!cr) return;

  editCourierId = cr.id;
  tempCourierPhoto = cr.photo;

  document.getElementById('c_name').value = cr.name;
  document.getElementById('c_phone').value = cr.phone;
  const pr = document.getElementById('c_preview');
  if (pr) { pr.src = cr.photo; pr.classList.remove('hidden'); }
}

function deleteCourier(id) {
  if (confirm('Hapus kurir ini?')) {
    couriers = couriers.filter(c => c.id !== id);
    save();
    render();
    showToast('Kurir berhasil dihapus!');
  }
}

function resetCourierForm() {
  editCourierId = null;
  tempCourierPhoto = '';
  render();
}

function compressAndPreviewCourierPhoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      tempCourierPhoto = e.target.result;
      const pr = document.getElementById('c_preview');
      if (pr) { pr.src = tempCourierPhoto; pr.classList.remove('hidden'); }
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// --- FUNGSI PENGATURAN TAMPILAN TOKO ---
function saveSiteSettings() {
  const stName = document.getElementById('st_name').value.trim();
  const stT1 = document.getElementById('st_t1').value.trim();
  const stT2 = document.getElementById('st_t2').value.trim();
  const stDesc = document.getElementById('st_desc').value.trim();

  if (!stName) return showToast('Nama toko tidak boleh kosong!');

  siteSettings.storeName = stName;
  siteSettings.bannerTitle1 = stT1;
  siteSettings.bannerTitle2 = stT2;
  siteSettings.bannerDesc = stDesc;
  if (tempBannerImg) siteSettings.bannerImage = tempBannerImg;

  save();
  render();
  showToast('Tampilan toko berhasil diperbarui!');
}

function compressAndPreviewBanner(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      tempBannerImg = e.target.result;
      const pr = document.getElementById('st_preview');
      if (pr) { pr.src = tempBannerImg; }
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function handleSaveAdminSettings() {
  const oldPassInput = document.getElementById('adm_old_pass').value;
  const newPassInput = document.getElementById('adm_pass').value;
  const confirmPassInput = document.getElementById('adm_confirm_pass').value;

  // 1. Validasi Password Lama
  if (!oldPassInput) {
    alert('Harap masukkan password lama Anda untuk verifikasi!');
    return;
  }

  if (oldPassInput !== adminAccount.pass) {
    alert('Password lama yang Anda masukkan salah!');
    return;
  }

  // 2. Validasi Password Baru & Konfirmasi
  if (newPassInput || confirmPassInput) {
    if (newPassInput !== confirmPassInput) {
      alert('Password baru dan konfirmasi password tidak cocok!');
      return;
    }
  }

  // 3. Panggil fungsi simpan jika verifikasi berhasil
  saveAdminSettings();
}
