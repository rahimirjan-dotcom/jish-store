// --- FUNGSI KOMPRESI & RESIZE GAMBAR OTOMATIS (MENGURANGI UKURAN BASE64) ---
function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
  return new Promise((resolve) => {
    if (!file || !file.type.startsWith('image/')) {
      resolve(null);
      return;
    }
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        // Ubah ke format JPEG dengan kualitas terkompresi
        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(compressedDataUrl);
      };
      img.onerror = () => resolve(event.target.result); // Fallback jika gagal
    };
    reader.onerror = () => resolve(null);
  });
}

// --- WEB AUDIO API ---
function playNotificationSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
  } catch (e) {
    console.warn("Audio Context error:", e);
  }
}

function render() {
  const app = document.getElementById('app');
  if (!navigator.onLine) {
    if (bannerInterval) { clearInterval(bannerInterval); bannerInterval = null; }
    app.innerHTML = `
      <div class="min-h-screen grid place-items-center p-6 bg-[#faf6f3]">
        <div class="text-center space-y-4">

          <p class="text-[11px] text-zinc-400">Menunggu sambungan jaringan...</p>
        </div>
      </div>
    `;
    return;
  }

  if (!isInitialDataLoaded) {
    if (bannerInterval) { clearInterval(bannerInterval); bannerInterval = null; }
    app.innerHTML = `
      <div class="min-h-screen grid place-items-center p-6 bg-[#faf6f3]">

          <p class="text-xs font-medium text-zinc-500">Memuat data terbaru dari server...</p>
        </div>
      </div>
    `;
    return;
  }

  document.title = siteSettings.storeName;
  if (bannerInterval) { clearInterval(bannerInterval); bannerInterval = null; }
  if (view === 'gate') app.innerHTML = gate();
  else if (view === 'login') app.innerHTML = login();
  else if (view === 'register') app.innerHTML = register();
  else if (view === 'loginAdmin') app.innerHTML = loginAdmin();
  else if (view === 'shop') {
    app.innerHTML = shop();
    startBannerSlider('activeBannerImg');
  } else if (view === 'admin') {
    app.innerHTML = isAdmin ? admin() : loginAdmin();
    if (adminTab === 'settings') {
      startBannerSlider('adminPreviewBannerImg');
    }
  } else if (view === 'history') app.innerHTML = currentBuyer ? history() : gate();
  else if (view === 'chat') app.innerHTML = currentBuyer ? chatBuyer() : gate();
  else app.innerHTML = gate();
}

function startBannerSlider(imgElementId) {
  if (bannerInterval) clearInterval(bannerInterval);
  const images = siteSettings.bannerImages || [];
  if (images.length <= 1) return;
  bannerInterval = setInterval(() => {
    currentBannerIndex = (currentBannerIndex + 1) % images.length;
    const imgElement = document.getElementById(imgElementId);
    const dotElements = document.querySelectorAll('.banner-dot');
    if (imgElement) {
      imgElement.classList.remove('banner-fade');
      void imgElement.offsetWidth;
      imgElement.src = images[currentBannerIndex];
      imgElement.classList.add('banner-fade');
    }
    dotElements.forEach((dot, idx) => {
      if (idx === currentBannerIndex) {
        dot.className = "banner-dot w-6 h-2 rounded-full bg-white transition-all";
      } else {
        dot.className = "banner-dot w-2 h-2 rounded-full bg-white/50 transition-all";
      }
    });
  }, 4000);
}

function doReg() {
  const n = document.getElementById('rn').value.trim();
  const e = document.getElementById('re').value.trim();
  const w = document.getElementById('rw').value.trim();
  const a = document.getElementById('ra').value.trim();
  const p = document.getElementById('rp').value;
  const pc = document.getElementById('rpc').value;
  if (!n || !e || !w || !a || !p || !pc) return showToast('Lengkapi semua bidang!');
  if (p !== pc) return showToast('Konfirmasi password tidak cocok!');
  if (buyers.find(b => b.email === e)) return showToast('Email sudah terdaftar!');
  const cleanWa = w.replace(/[^0-9]/g, '');
  if (buyers.find(b => b.phone === cleanWa || b.phone === w)) return showToast('Nomor WhatsApp sudah terdaftar!');
  buyers.push({ name: n, email: e, phone: cleanWa, address: a, pass: p, registeredAt: new Date().toISOString() });
  save();
  const waMsg = encodeURIComponent("Halo saya telah berhasil mendaftarkan akun saya di jish store!");
  window.open(`https://wa.me/${WA_NUMBER}?text=${waMsg}`, '_blank');
  showToast('Pendaftaran berhasil, silakan login!');
  view = 'login';
  render();
}

function doLogin() {
  const input = document.getElementById('le').value.trim();
  const p = document.getElementById('lp').value;
  if (!navigator.onLine) return showToast('Gagal masuk: Perangkat tidak terhubung ke internet!');
  const cleanInput = input.replace(/[^0-9]/g, '');
  const f = buyers.find(b => (b.email === input || (b.phone && b.phone === cleanInput)) && b.pass === p);
  if (!f) return showToast('Email/WA atau password salah!');
  currentBuyer = f;
  sessionStorage.setItem('ssr_cb', JSON.stringify(f));
  view = 'shop';
  render();
  showToast('Selamat datang, ' + f.name);
}

function doLoginAdmin() {
  const e = document.getElementById('ae').value;
  const p = document.getElementById('ap').value;
  if (!navigator.onLine) return showToast('Gagal masuk: Perangkat tidak terhubung ke internet!');
  if (adminAccount && e === adminAccount.email && p === adminAccount.pass) {
    sessionStorage.setItem('ssr_ad', '1');
    isAdmin = true;
    view = 'admin';
    render();
    showToast('Login Admin Berhasil');

    showToast('Kredensial Admin Salah!');
  }
}

function updateBuyerSettings() {
  if (!currentBuyer) return;
  const newEmail = document.getElementById('buyerEmailInput').value.trim();
  const newPhone = document.getElementById('buyerPhoneInput').value.trim();
  const oldP = document.getElementById('currentPass').value;
  const newP = document.getElementById('newPass').value;
  const confirmP = document.getElementById('confirmNewPass').value;
  if (!newEmail || !newPhone) return showToast('Email dan Nomor WhatsApp harus diisi!');
  const cleanPhone = newPhone.replace(/[^0-9]/g, '');
  const existingEmail = buyers.find(b => b.email === newEmail && b.email !== currentBuyer.email);
  if (existingEmail) return showToast('Email sudah digunakan oleh akun lain!');
  const existingPhone = buyers.find(b => b.phone === cleanPhone && b.email !== currentBuyer.email);
  if (existingPhone) return showToast('Nomor WhatsApp sudah digunakan oleh akun lain!');
  let passUpdated = false;
  if (oldP || newP || confirmP) {
    if (!oldP) return showToast('Masukkan password lama Anda!');
    if (currentBuyer.pass !== oldP) return showToast('Password lama Anda salah!');
    if (!newP) return showToast('Masukkan password baru!');
    if (newP !== confirmP) return showToast('Konfirmasi password baru tidak cocok!');
    passUpdated = true;
  }
  const idx = buyers.findIndex(b => b.email === currentBuyer.email);
  if (chatMessages && chatMessages.length > 0) {
    chatMessages.forEach(c => { if (c.buyerEmail === currentBuyer.email) c.buyerEmail = newEmail; });
  }
  if (orders && orders.length > 0) {
    orders.forEach(o => { if (o.buyerEmail === currentBuyer.email) { o.buyerEmail = newEmail; o.buyerPhone = cleanPhone; } });
  }
  currentBuyer.email = newEmail;
  currentBuyer.phone = cleanPhone;
  if (passUpdated) currentBuyer.pass = newP;
  if (idx > -1) {
    buyers[idx].email = newEmail;
    buyers[idx].phone = cleanPhone;
    if (passUpdated) buyers[idx].pass = newP;
  }
  sessionStorage.setItem('ssr_cb', JSON.stringify(currentBuyer));
  save();
  closeSettingsModal();
  render();
  showToast('Pengaturan akun berhasil diperbarui!');
}

function applyVoucher() {
  const codeInput = document.getElementById('voucherCodeInput').value.trim().toUpperCase();
  const v = storeVouchers.find(item => item.code === codeInput);
  if (!v) return showToast('Kode voucher tidak valid!');
  const subtotal = cart.reduce((sum, item) => {
    const p = getAllProducts().find(x => x.id === item.id);
    return sum + (p ? p.price * item.qty : 0);
  }, 0);
  if (subtotal < v.minPurchase) {
    return showToast(`Minimal belanja Rp ${v.minPurchase.toLocaleString('id-ID')} untuk menggunakan voucher ini!`);
  }
  appliedVoucher = { code: v.code, discount: v.discount };
  render();
  showToast('Voucher berhasil digunakan!');
  document.getElementById('cart').classList.remove('hidden');
}

function removeVoucher() {
  appliedVoucher = null;
  render();
  showToast('Voucher dihapus.');
  document.getElementById('cart').classList.remove('hidden');
}

function handleProductClick(id) {
  const p = getAllProducts().find(x => x.id === id);
  if (!p) return;
  activeDetailProduct = p;

  openProductDetailModal();
}

function selectDetailColor(index) {
  selectedDetailColorIndex = index;
  selectedDetailSize = '';
  renderProductDetailContent();
}

function selectDetailSize(size) {
  selectedDetailSize = size;
  renderProductDetailContent();
}

function confirmAddToCartFromDetail() {
  if (!activeDetailProduct) return;
  const p = activeDetailProduct;
  const hasDetail = p.hasVariations && p.colors && p.colors.length > 0;
  let currentColor = null;
  let sizeStock = p.stock;
  if (hasDetail) {
    currentColor = p.colors[selectedDetailColorIndex];
    if (!currentColor) return showToast('Pilih warna produk terlebih dahulu!');
    if (!selectedDetailSize) return showToast('Wajib memilih ukuran produk terlebih dahulu!');
    const szObj = currentColor.sizes.find(s => s.size === selectedDetailSize);
    sizeStock = szObj ? Number(szObj.stock) || 0 : 0;
  }
  if (sizeStock <= 0) return showToast('Stok untuk pilihan ini sedang habis!');
  const existingIndex = cart.findIndex(c => c.id === p.id && c.selectedColor === (currentColor ? currentColor.name : '') && c.selectedSize === selectedDetailSize);
  if (existingIndex > -1) {
    if (cart[existingIndex].qty + 1 > sizeStock) return showToast('Stok tidak mencukupi! Maksimal: ' + sizeStock);
    cart[existingIndex].qty++;
  } else {
    cart.push({
      id: p.id,
      qty: 1,
      selectedColor: currentColor ? currentColor.name : '',
      selectedColorImg: currentColor ? currentColor.image : '',
      selectedSize: selectedDetailSize
    });
  }
  save();
  closeProductDetailModal();
  render();
  showToast('Barang berhasil disimpan ke keranjang!');
}

function focusBuyerSearch() {
  const el = document.getElementById('buyerSearchInput');
  if (el) {
    el.focus();
    el.setSelectionRange(el.value.length, el.value.length);

}

function setDeliveryMethod(val) {
  deliverySettings.selectedMethod = val;
  save();
  render();

}

function updateCartSize(index, size) {
  if (cart[index]) {
    cart[index].selectedSize = size;
    save();
  }
}

function qty(index, delta) {
  if (!cart[index]) return;
  const item = cart[index];
  const p = getAllProducts().find(x => x.id === item.id);
  let availableStock = p ? p.stock : 0;
  if (p && p.hasVariations && item.selectedColor && item.selectedSize) {
    const cObj = p.colors.find(c => c.name === item.selectedColor);
    if (cObj) {
      const sObj = cObj.sizes.find(s => s.size === item.selectedSize);
      if (sObj) availableStock = Number(sObj.stock) || 0;
    }
  }
  if (delta > 0 && item.qty + 1 > availableStock) return showToast('Stok maksimum tercapai');
  item.qty += delta;
  if (item.qty <= 0) cart.splice(index, 1);
  save();
  render();
  document.getElementById('cart').classList.remove('hidden');
}

function openCart() {
  render();
  setTimeout(() => document.getElementById('cart').classList.remove('hidden'), 50);
}

function checkout() {
  if (!currentBuyer) return showToast('Silakan login terlebih dahulu');
  if (cart.length === 0) return showToast('Keranjang Anda kosong!');
  if (!deliverySettings.selectedMethod) {
    return showToast('Mohon pilih opsi Barang Diantarkan atau Diambil di Toko!');
  }
  let subtotal = 0;
  let totalItemQty = 0;
  let txt = [];
  let orderItemsDetails = [];
  for (let c of cart) {
    const p = products.find(x => x.id === c.id) || thirdPartyProducts.find(x => x.id === c.id);
    if (p) {
      if (p.hasVariations && c.selectedColor && c.selectedSize) {
        const cObj = p.colors ? p.colors.find(col => col.name === c.selectedColor) : null;
        if (cObj) {
          const sObj = cObj.sizes ? cObj.sizes.find(sz => sz.size === c.selectedSize) : null;
          if (sObj) {
            const currentStock = Number(sObj.stock) || 0;
            if (currentStock < c.qty) return showToast(`Stok ${p.name} (${c.selectedColor} - ${c.selectedSize}) kurang! Sisa: ${currentStock}`);
            sObj.stock = currentStock - c.qty;
          }
        }
      } else {
        if (p.stock < c.qty) return showToast(`Stok ${p.name} tidak mencukupi! Sisa: ${p.stock}`);
        p.stock -= c.qty;
      }
      subtotal += p.price * c.qty;
      totalItemQty += c.qty;
      const varText = [];
      if (c.selectedColor) varText.push(`Warna: ${c.selectedColor}`);
      if (c.selectedSize) varText.push(`Ukuran: ${c.selectedSize}`);
      const formatVar = varText.length > 0 ? ` [${varText.join(', ')}]` : '';
      txt.push(`${p.name}${formatVar} (${c.qty}x)`);
      orderItemsDetails.push({
        id: p.id,
        name: p.name,
        qty: c.qty,
        price: p.price,
        costPrice: p.costPrice || p.price,
        color: c.selectedColor || '',
        size: c.selectedSize || '',
        isThirdParty: !!p.isThirdParty,
        storeName: p.storeName || '',
        storeAddress: p.storeAddress || '',
        storePhone: p.storePhone || ''
      });
    }
  }

  const isDelivery = deliverySettings.selectedMethod === deliverySettings.deliveryLabel;
  const rawShippingFee = isDelivery ? (deliverySettings.deliveryFee || 0) : 0;
  const isDiscountEligible = isDelivery && (totalItemQty >= (deliverySettings.minQtyForDiscount || 1));
  const shippingDiscount = isDiscountEligible ? Math.min(rawShippingFee, (deliverySettings.discountAmount || 0)) : 0;
  const finalShippingFee = Math.max(0, rawShippingFee - shippingDiscount);
  const voucherDisc = appliedVoucher ? appliedVoucher.discount : 0;
  const grandTotal = Math.max(0, subtotal + finalShippingFee - voucherDisc);

  const orderData = {
    id: Date.now(),
    text: txt.join(', '),
    items: orderItemsDetails,
    deliveryMethod: deliverySettings.selectedMethod,
    subtotal: subtotal,
    rawShippingFee: rawShippingFee,
    shippingDiscount: shippingDiscount,
    shippingFee: finalShippingFee,
    voucherDiscount: voucherDisc,
    voucherCode: appliedVoucher ? appliedVoucher.code : null,
    total: grandTotal,
    buyerEmail: currentBuyer.email,
    buyerName: currentBuyer.name,
    buyerPhone: currentBuyer.phone || '-',
    buyerAddress: currentBuyer.address || '-',
    date: new Date().toLocaleString('id-ID'),
    rawDate: new Date().toISOString(),
    status: 'Diproses',
    courier: null
  };
  orders.unshift(orderData);
  cart = [];
  appliedVoucher = null;
  const selectedDelivery = deliverySettings.selectedMethod;
  deliverySettings.selectedMethod = "";
  save();
  const waText = `Halo Admin ${siteSettings.storeName},\n\nSaya *${currentBuyer.name}*\n📱 No. WA: ${currentBuyer.phone || '-'}\n📍 Alamat Lengkap: ${currentBuyer.address || '-'}\n\nIngin memesan:\n-------------------------------------\n- ${txt.join('\n- ')}\n-------------------------------------\n📌 *Opsi Penyerahan:* ${selectedDelivery}\n💵 *Subtotal Barang:* Rp ${subtotal.toLocaleString('id-ID')}\n🚚 *Biaya Pengiriman Normal:* Rp ${rawShippingFee.toLocaleString('id-ID')}\n🎁 *Potongan Ongkir:* ${shippingDiscount > 0 ? '-Rp ' + shippingDiscount.toLocaleString('id-ID') : 'Rp 0'}\n${voucherDisc > 0 ? `🎟️ *Voucher Diskon (${orderData.voucherCode}):* -Rp ${voucherDisc.toLocaleString('id-ID')}\n` : ''}💰 *TOTAL PEMBAYARAN:* Rp ${grandTotal.toLocaleString('id-ID')}\n-------------------------------------\nMohon diproses, terima kasih!`;
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}`, '_blank');
  view = 'history';
  render();
  showToast('Pesanan berhasil dibuat & stok barang otomatis berkurang!');
}

function buyerConfirmOrder(orderId) {
  if (confirm('Konfirmasi bahwa barang pesanan sudah Anda terima dengan baik?')) {
    const o = orders.find(x => x.id === orderId);
    if (o) {
      o.status = 'Selesai';
      save();
      render();
      showToast('Terima kasih! Pesanan dikonfirmasi selesai.');
    }
  }
}

function openReviewModalForOrder(orderId) {
  const o = orders.find(x => x.id === orderId);
  if (!o || !o.items || o.items.length === 0) return;
  const firstItem = o.items[0];
  document.getElementById('reviewProductId').value = firstItem.id;
  document.getElementById('reviewOrderId').value = o.id;
  document.getElementById('reviewRating').value = '5';
  document.getElementById('reviewComment').value = '';
  document.getElementById('reviewModal').classList.remove('hidden');
}

function closeReviewModal() {
  document.getElementById('reviewModal').classList.add('hidden');
}

function submitProductReview() {
  const productId = Number(document.getElementById('reviewProductId').value);
  const orderId = Number(document.getElementById('reviewOrderId').value);
  const rating = Number(document.getElementById('reviewRating').value);
  const comment = document.getElementById('reviewComment').value.trim();
  if (!comment) return showToast('Tuliskan komentar ulasan Anda!');
  const existingReview = productReviews.find(r => r.productId === productId && r.buyerEmail === (currentBuyer ? currentBuyer.email : '') && r.orderId === orderId);
  if (existingReview) {
    closeReviewModal();
    return showToast('Anda sudah memberikan ulasan untuk produk dari pesanan ini!');
  }
  productReviews.push({
    id: Date.now(),
    productId: productId,
    orderId: orderId,
    buyerEmail: currentBuyer ? currentBuyer.email : '',
    buyerName: currentBuyer ? currentBuyer.name : 'Pelanggan',
    rating: rating,
    comment: comment,
    date: new Date().toLocaleDateString('id-ID')
  });
  save();
  closeReviewModal();
  render();
  showToast('Terima kasih! Ulasan berhasil dikirim.');
}

  const input = document.getElementById('buyerChatInput');

function exportFinanceCSV() {
  const now = new Date();
  const filteredOrders = orders.filter(o => {
    if (o.status !== 'Selesai') return false;
    if (financeDateFilter === 'all') return true;
    const oDate = o.rawDate ? new Date(o.rawDate) : new Date();
    if (financeDateFilter === 'today') return oDate.toDateString() === now.toDateString();
    if (financeDateFilter === 'month') return oDate.getMonth() === now.getMonth() && oDate.getFullYear() === now.getFullYear();
    return true;
  });
  const filteredExpenses = operationalExpenses.filter(exp => {
    if (financeDateFilter === 'all') return true;
    const expDate = exp.date ? new Date(exp.date.split('/').reverse().join('-')) : new Date();
    if (financeDateFilter === 'today') return expDate.toDateString() === now.toDateString();
    if (financeDateFilter === 'month') return expDate.getMonth() === now.getMonth() && expDate.getFullYear() === now.getFullYear();
    return true;
  });
  let csvContent = "\uFEFF";
  csvContent += "=== LAPORAN KEUANGAN JISH STORE ===\n";
  csvContent += `Periode Filter:,${financeDateFilter.toUpperCase()}\n`;
  csvContent += `Tanggal Ekspor:,${new Date().toLocaleString('id-ID')}\n\n`;
  csvContent += "--- PEMASUKAN / OMSET PENJUALAN SELESAI ---\n";
  csvContent += "Order ID,Tanggal,Nama Pembeli,Metode Pengiriman,Subtotal Barang,Biaya Ongkir,Diskon Voucher,Total Omset\n";
  let totalOmset = 0;
  let totalModal = 0;
  filteredOrders.forEach(o => {
    totalOmset += o.total;
    let orderModal = 0;
    if (o.items) {
      o.items.forEach(it => { orderModal += (it.costPrice || it.price) * it.qty; });
    }
    totalModal += orderModal;
    csvContent += `"#${o.id}","${o.date}","${o.buyerName}","${o.deliveryMethod}",${o.subtotal},${o.shippingFee},${o.voucherDiscount || 0},${o.total}\n`;
  });
  csvContent += `\nTotal Omset:,${totalOmset}\n`;
  csvContent += `Total Modal Barang:,${totalModal}\n\n`;
  csvContent += "--- PENGELUARAN OPERASIONAL ---\n";
  csvContent += "ID,Tanggal,Keterangan Pengeluaran,Nominal Biaya\n";
  let totalExpenses = 0;
  filteredExpenses.forEach(exp => {
    totalExpenses += exp.amount;
    csvContent += `"${exp.id}","${exp.date}","${exp.title}",${exp.amount}\n`;
  });
  csvContent += `\nTotal Pengeluaran:,${totalExpenses}\n`;
  let netProfit = (totalOmset - totalModal) - totalExpenses;
  csvContent += `LABA BERSIH (NET PROFIT):,${netProfit}\n`;

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `laporan_keuangan_${financeDateFilter}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('Laporan Keuangan berhasil diunduh ke CSV!');
}

// --- BACKUP & RESTORE DENGAN ZIP ---
async function exportAppData() {
  try {
    showToast('Menyiapkan file backup...');
    const zip = new JSZip();
    const exportObj = {
      products: JSON.parse(JSON.stringify(products)),
      thirdPartyProducts: JSON.parse(JSON.stringify(thirdPartyProducts)),
      couriers: JSON.parse(JSON.stringify(couriers)),
      buyers, orders, siteSettings, categorySizes, deliverySettings, chatMessages, productReviews, operationalExpenses, stockRestockLogs, storeVouchers, adminAccount
    };
    zip.file("database.json", JSON.stringify(exportObj, null, 2));
    const content = await zip.generateAsync({type: "blob"});
    saveAs(content, `jish_store_backup_${new Date().toISOString().slice(0,10)}.zip`);
    showToast('Backup berhasil diunduh!');
  } catch (err) {
    console.error(err);
    alert('Gagal membuat backup.');
  }
}

async function importAppData(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    const fileName = file.name.toLowerCase();
    try {
      showToast('Memproses pemulihan...');
      if (fileName.endsWith('.zip')) {
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(file);
        if (!zipContent.files["database.json"]) return alert('database.json tidak ditemukan dalam ZIP!');
        const jsonString = await zipContent.files["database.json"].async("string");
        const imported = JSON.parse(jsonString);
        applyImportedData(imported);
        save();
        render();
        showToast('Data berhasil dipulihkan!');
      } else if (fileName.endsWith('.json')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imported = JSON.parse(e.target.result);
          applyImportedData(imported);
          save();
          render();
          showToast('Data JSON berhasil dipulihkan!');
        };
        reader.readAsText(file);
      }
    } catch (err) {
      console.error(err);
      alert('Gagal memulihkan data.');
    }
  }
}

function applyImportedData(imported) {
  if (imported.products) products = imported.products;
  if (imported.thirdPartyProducts) thirdPartyProducts = imported.thirdPartyProducts;
  if (imported.couriers) couriers = imported.couriers;
  if (imported.buyers) buyers = imported.buyers;
  if (imported.orders) orders = imported.orders;
  if (imported.siteSettings) siteSettings = imported.siteSettings;
  if (imported.categorySizes) categorySizes = imported.categorySizes;
  if (imported.deliverySettings) deliverySettings = imported.deliverySettings;
  if (imported.chatMessages) chatMessages = imported.chatMessages;
  if (imported.productReviews) productReviews = imported.productReviews;
  if (imported.operationalExpenses) operationalExpenses = imported.operationalExpenses;
  if (imported.stockRestockLogs) stockRestockLogs = imported.stockRestockLogs;
  if (imported.storeVouchers) storeVouchers = imported.storeVouchers;
  if (imported.adminAccount) adminAccount = imported.adminAccount;
}

      if (pr) { pr.src = tempTpImg; pr.classList.remove('hidden'); }

async function saveTpProduct() {
  const storeName = document.getElementById('tp_storeName').value.trim();
  const storePhone = document.getElementById('tp_storePhone').value.trim();
  const storeAddress = document.getElementById('tp_storeAddress').value.trim();
  const name = document.getElementById('tp_name').value.trim();
  const costPrice = Number(document.getElementById('tp_costPrice').value);
  const price = Number(document.getElementById('tp_price').value);
  const oldPrice = Number(document.getElementById('tp_oldPrice').value) || 0;
  const stock = Number(document.getElementById('tp_stock').value) || 0;
  const cat = document.getElementById('tp_cat').value.trim() || 'General';
  const hasVariations = document.getElementById('tpHasVariations').checked;

  if (!storeName || !storePhone || !storeAddress || !name || !costPrice || !price) {
    return showToast('Lengkapi informasi toko, nama, harga beli & jual!');
  }

  let imageUrl = tempTpImg || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500";
  const fileInput = document.getElementById('tp_file');
  if (fileInput && fileInput.files && fileInput.files[0] && !tempTpImg) {
    imageUrl = await compressImage(fileInput.files[0], 800, 800, 0.7);
  }

  let colorsList = [];
  if (hasVariations) {
    const rawColors = collectColorsData('tp');
    for (let c of rawColors) {
      if (c.tempFileObj) {
        c.image = await compressImage(c.tempFileObj, 600, 600, 0.7);
      }
      colorsList.push({ name: c.name, image: c.image, sizes: c.sizes });
    }
    if (colorsList.length === 0) return showToast('Tambahkan minimal 1 warna variasi!');
  }

  const cleanStorePhone = storePhone.replace(/[^0-9]/g, '');

  if (editTpId) {
    const idx = thirdPartyProducts.findIndex(p => p.id === editTpId);
    if (idx > -1) {
      thirdPartyProducts[idx] = {
        ...thirdPartyProducts[idx],
        storeName, storePhone: cleanStorePhone, storeAddress, name, costPrice, price, oldPrice, stock, cat,
        image: imageUrl, hasVariations, colors: colorsList
      };
    }
  } else {
    thirdPartyProducts.unshift({
      id: Date.now(), isThirdParty: true,
      storeName, storePhone: cleanStorePhone, storeAddress, name, costPrice, price, oldPrice, stock, cat,
      image: imageUrl, hasVariations, colors: colorsList
    });
  }
  save();
  resetTpForm();
  render();
  showToast('Barang berhasil disimpan dengan gambar terkompresi!');
}

function editTpProduct(id) {
  const p = thirdPartyProducts.find(x => x.id === id);
  if (!p) return;
  editTpId = p.id;
  tempTpImg = p.image;
  tempTpProductColors = JSON.parse(JSON.stringify(p.colors || []));
  render();
  setTimeout(() => {
    document.getElementById('tp_storeName').value = p.storeName || '';
    document.getElementById('tp_storePhone').value = p.storePhone || '';
    document.getElementById('tp_storeAddress').value = p.storeAddress || '';
    document.getElementById('tp_name').value = p.name;
    document.getElementById('tp_costPrice').value = p.costPrice || p.price;
    document.getElementById('tp_price').value = p.price;
    document.getElementById('tp_oldPrice').value = p.oldPrice || '';
    document.getElementById('tp_stock').value = p.stock;
    document.getElementById('tp_cat').value = p.cat;
    const pr = document.getElementById('tp_preview');
    if (pr) { pr.src = p.image; pr.classList.remove('hidden'); }
    const chk = document.getElementById('tpHasVariations');
    if (chk) {
      chk.checked = !!p.hasVariations;
      toggleVariationSection(chk.checked, 'tp');
      if (p.hasVariations) renderColorList('tp', tempTpProductColors);
    }
    document.getElementById('tpFormContainer')?.scrollIntoView({ behavior: 'smooth' });
  }, 100);
}

function deleteTpProduct(id) {

    thirdPartyProducts = thirdPartyProducts.filter(x => x.id !== id);

    render();
    showToast('Barang dihapus.');

}

function resetTpForm() {

}

function updateTpItemSearch(storeName, val) {

  render();
  setTimeout(() => {
    document.getElementById(`tpItemSearch_${encodeURIComponent(storeName)}`)?.focus();

function toggleVariationSection(checked, type) {
  const container = document.getElementById(type === 'main' ? 'mainVariationContainer' : 'tpVariationContainer');
  const stockInput = document.getElementById(type === 'main' ? 'ps' : 'tp_stock');
  if (checked) {
    container?.classList.remove('hidden');
    if (stockInput) { stockInput.disabled = true; stockInput.value = '0'; }
    const list = type === 'main' ? tempProductColors : tempTpProductColors;
    if (list.length === 0) addColorVariation(type);
    else renderColorList(type, list);
  } else {
    container?.classList.add('hidden');
    if (stockInput) stockInput.disabled = false;
  }
}

function addColorVariation(type) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  targetArray.push({ name: '', image: 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500', tempFileObj: null, sizes: [{ size: 'S', stock: 5 }, { size: 'M', stock: 5 }] });
  renderColorList(type, targetArray);
}

function removeColorVariation(type, index) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  targetArray.splice(index, 1);
  renderColorList(type, targetArray);
}

function addSizeToColor(type, colorIndex) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  if (targetArray[colorIndex]) {
    targetArray[colorIndex].sizes.push({ size: 'L', stock: 5 });
    renderColorList(type, targetArray);
  }
}

function removeSizeFromColor(type, colorIndex, sizeIndex) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  if (targetArray[colorIndex]?.sizes) {
    targetArray[colorIndex].sizes.splice(sizeIndex, 1);
    renderColorList(type, targetArray);
  }
}

function renderColorList(type, colorsArray) {
  const listContainer = document.getElementById(type === 'main' ? 'mainColorList' : 'tpColorList');
  if (!listContainer) return;
  listContainer.innerHTML = colorsArray.map((c, cIdx) => `
    <div class="p-3 bg-white rounded-2xl border border-purple-200 space-y-2">
      <div class="flex justify-between items-center gap-2">
        <input type="text" value="${c.name}" placeholder="Nama Warna (cth: Merah)" onchange="${type === 'main' ? 'tempProductColors' : 'tempTpProductColors'}[${cIdx}].name=this.value" class="flex-1 border border-zinc-200 bg-[#faf6f3] p-2 rounded-xl text-xs font-bold outline-none">
        <button onclick="removeColorVariation('${type}', ${cIdx})" class="text-red-500 font-bold text-xs p-1">🗑️</button>
      </div>
      <div class="flex items-center gap-2">
        <input type="file" accept="image/*" onchange="captureColorFile(this, '${type}', ${cIdx})" class="w-full text-[11px] text-zinc-500 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:bg-purple-100 file:text-purple-900">
        <img id="${type}_color_preview_${cIdx}" src="${c.image || 'https://via.placeholder.com/100'}" class="w-8 h-8 rounded-lg object-cover border border-zinc-200">
      </div>
      <div class="pt-2 border-t border-zinc-100">
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-[11px] font-bold text-zinc-700">Ukuran & Stok:</span>
          <button onclick="addSizeToColor('${type}', ${cIdx})" class="text-purple-800 font-bold text-[11px]">+ Tambah Ukuran</button>
        </div>
        <div class="space-y-1.5">
          ${c.sizes.map((sz, sIdx) => `
            <div class="flex items-center gap-2">
              <input type="text" value="${sz.size}" onchange="${type === 'main' ? 'tempProductColors' : 'tempTpProductColors'}[${cIdx}].sizes[${sIdx}].size=this.value" class="w-24 border p-1.5 rounded-lg text-xs font-semibold">
              <input type="number" value="${sz.stock}" onchange="${type === 'main' ? 'tempProductColors' : 'tempTpProductColors'}[${cIdx}].sizes[${sIdx}].stock=Number(this.value)" class="w-20 border p-1.5 rounded-lg text-xs font-bold text-emerald-800">
              <button onclick="removeSizeFromColor('${type}', ${cIdx}, ${sIdx})" class="text-red-400 font-bold text-xs">✕</button>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function captureColorFile(input, type, colorIndex) {
  if (input.files && input.files[0]) {
    const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
    if (targetArray[colorIndex]) {
      targetArray[colorIndex].tempFileObj = input.files[0];
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById(`${type}_color_preview_${colorIndex}`).src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }
}

function collectColorsData(type) {
  const targetArray = type === 'main' ? tempProductColors : tempTpProductColors;
  return targetArray.map(c => ({
    name: c.name || 'Warna Standard',
    image: c.image || 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500',
    tempFileObj: c.tempFileObj || null,
    sizes: c.sizes ? c.sizes.map(s => ({ size: String(s.size).trim(), stock: Number(s.stock) || 0 })) : []
  }));
}

function openRestockModal(id) {
  const p = thirdPartyProducts.find(x => x.id === id) || products.find(x => x.id === id);
  if (!p) return;
  if (p.hasVariations && p.colors?.length > 0) {
    let colorOptionsText = p.colors.map((c, idx) => `${idx + 1}. ${c.name}`).join('\n');
    let colorChoice = prompt(`📦 RESTOK "${p.name}"\nPilih nomor warna:\n${colorOptionsText}`, "1");
    if (!colorChoice) return;
    let cIdx = Number(colorChoice) - 1;
    if (isNaN(cIdx) || !p.colors[cIdx]) return alert('Pilihan warna tidak valid!');
    const selectedColor = p.colors[cIdx];
    let sizeOptionsText = selectedColor.sizes.map((s, idx) => `${idx + 1}. Ukuran ${s.size} (Stok: ${s.stock})`).join('\n');
    let sizeChoice = prompt(`Pilih nomor ukuran untuk "${selectedColor.name}":\n${sizeOptionsText}`, "1");
    if (!sizeChoice) return;
    let sIdx = Number(sizeChoice) - 1;
    if (isNaN(sIdx) || !selectedColor.sizes[sIdx]) return alert('Pilihan ukuran tidak valid!');
    const selectedSizeObj = selectedColor.sizes[sIdx];
    let addQty = prompt(`Jumlah tambahan stok untuk ${selectedColor.name} - ${selectedSizeObj.size}:`, "10");
    if (addQty && !isNaN(addQty) && Number(addQty) > 0) {
      const qtyNum = Number(addQty);
      selectedSizeObj.stock = (Number(selectedSizeObj.stock) || 0) + qtyNum;
      stockRestockLogs.unshift({ id: Date.now(), productName: `${p.name} (${selectedColor.name} - Uk. ${selectedSizeObj.size})`, qtyAdded: qtyNum, date: new Date().toLocaleString('id-ID') });
      save();
      render();
      showToast(`Berhasil menambah ${qtyNum} stok!`);
    }
  } else {
    const addQty = prompt(`Tambah stok untuk "${p.name}":`, "10");
    if (addQty && !isNaN(addQty) && Number(addQty) > 0) {
      const qtyNum = Number(addQty);
      p.stock += qtyNum;
      stockRestockLogs.unshift({ id: Date.now(), productName: p.name, qtyAdded: qtyNum, date: new Date().toLocaleString('id-ID') });
      save();
      render();
      showToast(`Berhasil menambah ${qtyNum} stok!`);
    }
  }
}

}

function saveSiteSettings() {
  siteSettings.storeName = document.getElementById('st_name').value.trim() || siteSettings.storeName;
  siteSettings.bannerTitle1 = document.getElementById('st_t1').value.trim();
  siteSettings.bannerTitle2 = document.getElementById('st_t2').value.trim();
  siteSettings.bannerDesc = document.getElementById('st_desc').value.trim();
  save();
  render();
  showToast('Tampilan toko diperbarui!');
}

function handleSaveAdminSettings() {
  const oldP = document.getElementById('adm_old_pass').value;
  const newP = document.getElementById('adm_pass').value;
  const confirmP = document.getElementById('adm_confirm_pass').value;
  if (oldP !== adminAccount.pass) return alert('Password lama salah!');
  if (newP && newP !== confirmP) return alert('Konfirmasi password tidak cocok!');
  adminAccount.phone = document.getElementById('adm_wa').value.trim().replace(/[^0-9]/g, '');
  adminAccount.email = document.getElementById('adm_email').value.trim();
  adminAccount.address = document.getElementById('adm_address').value.trim();
  if (newP) adminAccount.pass = newP;
  WA_NUMBER = adminAccount.phone;
  save();
  render();
  showToast('Pengaturan Admin Diperbarui!');
}

function printOrderReceipt(orderId) {
  const o = orders.find(x => x.id === orderId);
  if (!o) return;
  document.body.className = "printing-receipt";
  document.getElementById('printableReceipt').innerHTML = `
    <div style="font-family: monospace; width: 300px; padding: 20px; background: white; color: black; font-size: 12px;">
      <h3>${siteSettings.storeName}</h3>
      <p>${adminAccount.address}</p>
      <hr>
      <p><b>Order ID:</b> #${o.id}</p>
      <p><b>Pembeli:</b> ${o.buyerName} (${o.buyerPhone})</p>
      <p>${o.text}</p>
      <hr>
      <p><b>Total: Rp ${o.total.toLocaleString('id-ID')}</b></p>
    </div>
  `;
  window.print();
  document.body.className = "";
}

function printAddressLabel(orderId) {
  const o = orders.find(x => x.id === orderId);
  if (!o) return;
  document.body.className = "printing-label";
  document.getElementById('printableAddressLabel').innerHTML = `
    <div style="font-family: sans-serif; width: 400px; padding: 25px; border: 2px solid black; background: white;">
      <h2>${siteSettings.storeName}</h2>
      <h3>Penerima: ${o.buyerName}</h3>
      <p>📱 ${o.buyerPhone}</p>
      <p>📍 ${o.buyerAddress}</p>
    </div>
  `;
  window.print();
  document.body.className = "";
}

function openCourierModal(orderId) {
  activeAssignOrderId = orderId;
  const o = orders.find(x => x.id === orderId);
  selectedCourierIdInModal = o?.courier?.id || null;
  document.getElementById('courierSelectionList').innerHTML = couriers.map(cr => `
    <label class="flex items-center gap-3 p-3 rounded-2xl border bg-[#faf6f3] cursor-pointer">
      <input type="radio" name="modalCourierSelect" value="${cr.id}" ${selectedCourierIdInModal === cr.id ? 'checked' : ''} onchange="selectedCourierIdInModal=${cr.id}" class="accent-purple-800">
      <img src="${cr.photo}" class="w-9 h-9 rounded-full object-cover">
      <div><p class="text-xs font-bold">${cr.name}</p><p class="text-[10px]">${cr.phone}</p></div>
    </label>
  `).join('');
  document.getElementById('courierModal').classList.remove('hidden');
}

function closeCourierModal() {
  document.getElementById('courierModal').classList.add('hidden');
}

function confirmCourierAssignment() {
  if (!activeAssignOrderId || !selectedCourierIdInModal) return;
  const cr = couriers.find(c => c.id === selectedCourierIdInModal);
  const o = orders.find(x => x.id === activeAssignOrderId);
  if (cr && o) {
    o.courier = cr;
    save();
    closeCourierModal();
    render();
    showToast('Kurir diset!');
  }
}

function openShippingWaModal(orderId) {
  activeShippingWaOrderId = orderId;
  const o = orders.find(x => x.id === orderId);
  document.getElementById('shippingCourierSelect').innerHTML = '<option value="">-- Pilih Kurir --</option>' + couriers.map(cr => `<option value="${cr.id}" ${o?.courier?.id === cr.id ? 'selected' : ''}>${cr.name}</option>`).join('');
  document.getElementById('shippingWaModal').classList.remove('hidden');
}

function closeShippingWaModal() {
  document.getElementById('shippingWaModal').classList.add('hidden');
}

function executeShippingWaConfirmation() {
  const o = orders.find(x => x.id === activeShippingWaOrderId);
  if (!o) return;
  const courierVal = document.getElementById('shippingCourierSelect').value;
  if (courierVal) o.courier = couriers.find(c => c.id === Number(courierVal));
  o.status = 'Dalam Pengiriman';
  save();
  closeShippingWaModal();
  render();
  const buyerPhone = o.buyerPhone.replace(/[^0-9]/g, '');
  const msg = encodeURIComponent(`Halo ${o.buyerName}, pesanan #${o.id} sedang dalam pengiriman.`);
  window.open(`https://wa.me/${buyerPhone}?text=${msg}`, '_blank');
  showToast('Status dikonfirmasi & WA dikirim!');
}

function updateOrderStatus(id, status) {
  const o = orders.find(x => x.id === id);
  if (o) { o.status = status; save(); render(); showToast('Status diperbarui!'); }
}

function deleteOrder(id) {
  if (confirm('Hapus pesanan?')) { orders = orders.filter(x => x.id !== id); save(); render(); showToast('Pesanan dihapus.'); }
}

function sendAdminChat() {
  const input = document.getElementById('adminChatInput');
  const txt = input ? input.value.trim() : '';
  if (!txt || !selectedAdminChatEmail) return;
  chatMessages.push({ id: Date.now(), buyerEmail: selectedAdminChatEmail, sender: 'admin', text: txt, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) });
  save();
  render();
}

function deleteBuyer(email) {
  if (confirm('Hapus pembeli?')) { buyers = buyers.filter(b => b.email !== email); save(); render(); showToast('Pembeli dihapus.'); }
}
</script>

onValue(ref(db, 'app_data'), (snapshot) => {
  const data = snapshot.val();
  if (data) {
    isInitialDataLoaded = true;
    if (orders.length > 0 && data.orders && data.orders.length > orders.length && isAdmin) {
      playNotificationSound();
      showToast('🔔 Ada pesanan baru masuk!');
    }
    applyDataToState(data);
    if (view === 'chat' && document.getElementById('buyerChatInput') === document.activeElement) return;
    if (isAdmin && adminTab === 'buyers' && document.getElementById('adminChatInput') === document.activeElement) return;
    render();
  } else {
    isInitialDataLoaded = true;
    render();
  }
});

function applyDataToState(data) {
  if (data.products) products = data.products;
  if (data.thirdPartyProducts) thirdPartyProducts = data.thirdPartyProducts;
  if (data.couriers) couriers = data.couriers;
  if (data.buyers) buyers = buyers.length > 0 ? buyers : (data.buyers || []);
  if (data.orders) orders = data.orders;
  if (data.siteSettings) {
    siteSettings = data.siteSettings;
    if (!siteSettings.bannerImages && siteSettings.bannerImage) siteSettings.bannerImages = [siteSettings.bannerImage];
  }
  if (data.categorySizes) categorySizes = data.categorySizes;
  if (data.deliverySettings) deliverySettings = data.deliverySettings;
  if (data.chatMessages) chatMessages = data.chatMessages;
  if (data.productReviews) productReviews = data.productReviews;
  if (data.operationalExpenses) operationalExpenses = data.operationalExpenses;
  if (data.stockRestockLogs) stockRestockLogs = data.stockRestockLogs;
  if (data.storeVouchers) storeVouchers = data.storeVouchers;
  if (data.adminAccount) adminAccount = data.adminAccount;
}
render();
</script>
